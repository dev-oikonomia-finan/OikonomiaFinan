<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>Oikonomia-Finan</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d1f;--mu:#6b7378;--ac:#0f766e;--red:#b42318;--grn:#067647;--bd:#e3e6e8}
@media(prefers-color-scheme:dark){:root{--bg:#111415;--card:#1b1f21;--tx:#eceff0;--mu:#99a2a7;--ac:#2dd4bf;--red:#f97066;--grn:#47cd89;--bd:#2c3236}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 80px}
h1{font-size:1.2rem;margin:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#hb{font-size:.8rem;padding:6px 10px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main,.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-top:10px}
input,select{width:100%;font:inherit;padding:11px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);border-radius:10px;padding:11px 14px;background:var(--card);color:var(--tx)}
.pri{width:100%;margin-top:14px;background:var(--ac);color:#fff;border:0;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:.85rem}.neg{color:var(--red)}.pos{color:var(--grn)}
.x{padding:2px 8px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips button{padding:8px 12px;border-radius:20px}
.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{width:100%;margin-top:8px}.lk{border:0;background:none;color:var(--mu);padding:8px 0;margin-top:4px;font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mu)}nav .on{color:var(--ac);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1><span>🏠 Oikonomia-Finan</span><button id="hb" hidden></button></h1>

<div id="login" class="wrap" hidden><form id="lf" class="card">
  <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
  <label>Senha<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="pri">Entrar</button><p id="lmsg" class="neg"></p>
</form></div>

<div id="onboard" class="wrap" hidden>
  <div class="card"><b>Primeiro acesso: criar a família</b>
    <label>Nome da família<input id="hn" value="Nossa família"></label>
    <label>Seu nome<input id="mn"></label>
    <button class="pri" id="mk">Criar família</button></div>
  <div class="card"><b>Ou entrar numa família existente</b>
    <label>Código de convite<input id="cd"></label>
    <label>Seu nome<input id="mn2"></label>
    <button class="pri" id="jn">Entrar</button></div>
  <p id="omsg" class="neg"></p>
</div>

<div id="app" hidden><main id="main"></main>
<nav><button data-t="add">➕ Lançar</button><button data-t="list">📋 Lançamentos</button><button data-t="acc">🏦 Contas</button></nav></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qjsqgujcsjxhvjumpbtd.supabase.co";
const SUPABASE_KEY="sb_publishable_pxLDAve7JSVg-R0Pv5hPWQ__X33phlf";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,c)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:(c||"BRL").trim()}).format(v);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const num=s=>{s=s.trim();return s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s)};
const TYPES={checking:"Conta corrente",cash:"Dinheiro",credit_card:"Cartão de crédito",investment:"Investimento",loan:"Empréstimo",financing:"Financiamento",fgts:"FGTS",pension:"Previdência",other:"Outra"};
let S={qs:[],qa:{},pre:null,uid:null,hs:[],hid:null,accounts:[],cats:[],kind:"expense",tab:"add",rt:false,lastAcc:null};
const show=v=>{["login","onboard","app"].forEach(x=>$(x).hidden=x!==v);$("hb").hidden=v!=="app";};

$("lf").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  error?$("lmsg").textContent="E-mail ou senha incorretos.":start();};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.hid=null;show("login");}});

async function loadHouseholds(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return null;
  S.uid=user.id;
  const {data}=await sb.from("household_members").select("household_id,households(name)").eq("user_id",user.id);
  S.hs=(data||[]).map(m=>({id:m.household_id,name:m.households?.name||"Família"}));
  return user;
}
async function start(prevIds){
  const user=await loadHouseholds();
  if(!user)return show("login");
  if(!S.hs.length)return show("onboard");
  const novo=prevIds&&S.hs.find(h=>!prevIds.includes(h.id));
  let saved=null;try{saved=localStorage.getItem("hid")}catch(e){}
  const h=novo||S.hs.find(h=>h.id===S.hid)||S.hs.find(h=>h.id===saved)||S.hs[0];
  await pick(h.id,true);subscribe();
}
async function pick(id,keep){
  S.hid=id;S.lastAcc=null;S.pre=null;
  try{localStorage.setItem("hid",id)}catch(e){}
  $("hb").textContent="⇄ "+S.hs.find(x=>x.id===id).name;
  show("app");await loadRef();go(keep&&S.tab!=="fam"?S.tab:"add");
}
async function loadRef(){
  const [a,c]=await Promise.all([
    sb.from("accounts").select("*").eq("household_id",S.hid).eq("is_active",true).order("name"),
    sb.from("categories").select("*").or(`household_id.eq.${S.hid},household_id.is.null`).eq("is_active",true).order("name")]);
  S.accounts=a.data||[];S.cats=c.data||[];await loadQs();
}
const fa=v=>v==null?"":String(v).replace(".",",");
async function loadQs(){
  const [q,m]=await Promise.all([
    sb.from("quick_entries").select("*").eq("household_id",S.hid).eq("is_active",true),
    sb.from("quick_entry_accounts").select("quick_entry_id,account_id").eq("household_id",S.hid).eq("user_id",S.uid)]);
  S.qs=(q.data||[]).sort((a,b)=>(b.is_favorite-a.is_favorite)||(b.use_count-a.use_count)||a.name.localeCompare(b.name));
  S.qa=Object.fromEntries((m.data||[]).map(r=>[r.quick_entry_id,r.account_id]));
}
function subscribe(){if(S.rt)return;S.rt=true;
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"transactions"},()=>{if(S.tab==="list")viewList();}).subscribe();}

async function onb(fn,args,msgId){
  const prev=S.hs.map(h=>h.id);
  const {error}=await sb.rpc(fn,args);
  error?$(msgId).textContent=error.message:start(prev);}
$("mk").onclick=()=>onb("create_household",{p_name:$("hn").value,p_display_name:$("mn").value},"omsg");
$("jn").onclick=()=>onb("join_household",{p_code:$("cd").value.trim(),p_display_name:$("mn2").value},"omsg");
$("hb").onclick=()=>go("fam");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){S.tab=t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===(t==="qs"?"add":t)));
  ({add:viewAdd,list:viewList,acc:viewAcc,fam:viewFam,qs:viewQs})[t]();}

function viewFam(){
  $("main").innerHTML=`<div class="card"><b>Minhas famílias</b>${S.hs.map(h=>`<div class="row"><div>${esc(h.name)}${h.id===S.hid?' <span class="mu">(atual)</span>':""}</div>${h.id===S.hid?"":`<button data-sw="${h.id}">Trocar</button>`}</div>`).join("")}</div>
  <div class="card"><b>Criar nova família</b><div class="mu">Ex.: uma família de testes/demonstração</div>
   <label>Nome da família<input id="fn" value="Família de teste"></label>
   <label>Seu nome nela<input id="fm"></label>
   <button class="pri" id="fk">Criar e entrar</button></div>
  <div class="card"><b>Entrar com código de convite</b>
   <label>Código<input id="fc"></label>
   <label>Seu nome nela<input id="fm2"></label>
   <button class="pri" id="fj">Entrar</button></div>
  <p id="fmsg" class="neg"></p>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>pick(b.dataset.sw));
  $("fk").onclick=()=>onb("create_household",{p_name:$("fn").value,p_display_name:$("fm").value},"fmsg");
  $("fj").onclick=()=>onb("join_household",{p_code:$("fc").value.trim(),p_display_name:$("fm2").value},"fmsg");
}

function viewAdd(){
  if(!S.accounts.length){$("main").innerHTML='<div class="card">Cadastre uma conta primeiro, na aba <b>Contas</b>.</div>';return;}
  const P=S.pre||{};
  const cats=S.cats.filter(c=>c.kind===S.kind);
  const qs=S.qs.filter(q=>q.kind===S.kind);
  const accSel=P.acc||S.lastAcc;
  $("main").innerHTML=`<div class="card">
   <div class="seg"><button data-k="expense" class="${S.kind==="expense"?"on":""}">Despesa</button><button data-k="income" class="${S.kind==="income"?"on":""}">Receita</button></div>
   ${qs.length?`<div class="chips">${qs.map(q=>`<button data-q="${q.id}" class="${P.qid===q.id?"on":""}">${q.is_favorite?"⭐ ":""}${esc(q.name)}</button>`).join("")}</div>`:""}
   <button class="lk" id="mq">⚙ Gerenciar atalhos</button>
   <label>Valor<input id="v" inputmode="decimal" placeholder="0,00" value="${fa(P.amt)}"></label>
   <label>Categoria<select id="cat">${cats.map(c=>`<option value="${c.id}" ${c.id===P.cat?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
   <label>Conta / cartão<select id="acc">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===accSel?"selected":""}>${esc(a.name)} (${a.currency.trim()})</option>`).join("")}</select></label>
   <div id="pin"></div>
   <label>Descrição<input id="desc" value="${esc(P.desc||"")}"></label>
   <label>Data<input id="dt" type="date" value="${today()}"></label>
   <button class="pri" id="save">Salvar</button><button class="sec" id="sq">⭐ Salvar como atalho</button><p id="msg" class="mu"></p></div>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;S.pre=null;viewAdd();});
  $("mq").onclick=()=>go("qs");
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const q=S.qs.find(x=>x.id===b.dataset.q);
    const ok=id=>S.accounts.some(a=>a.id===id)?id:null;
    S.pre={qid:q.id,cat:q.category_id,acc:ok(S.qa[q.id])||ok(q.default_account_id)||S.lastAcc,desc:q.name,amt:q.default_amount};
    viewAdd();$("v").focus();});
  $("acc").onchange=()=>{
    if(!P.qid||$("acc").value===S.qa[P.qid]){$("pin").innerHTML="";return;}
    $("pin").innerHTML='<button class="lk" id="pb">📌 Usar esta conta como minha neste atalho</button>';
    $("pb").onclick=async()=>{const acc=$("acc").value;
      const {error}=await sb.from("quick_entry_accounts").upsert({quick_entry_id:P.qid,user_id:S.uid,household_id:S.hid,account_id:acc});
      if(error)return $("msg").textContent="Erro: "+error.message;
      S.qa[P.qid]=acc;P.acc=acc;$("pin").innerHTML="";$("msg").textContent="Conta fixada ✓";};};
  $("save").onclick=async()=>{
    const val=num($("v").value);
    if(!(val>0))return $("msg").textContent="Informe um valor válido.";
    S.lastAcc=$("acc").value;
    const {error}=await sb.from("transactions").insert({account_id:S.lastAcc,date:$("dt").value,
      amount:S.kind==="expense"?-val:val,category_id:$("cat").value||null,description:$("desc").value||null,
      status:$("dt").value>today()?"planned":"posted"});
    if(error)return $("msg").textContent="Erro: "+error.message;
    if(P.qid)await sb.from("quick_entries").update({use_count:(S.qs.find(x=>x.id===P.qid)?.use_count||0)+1,last_used_at:new Date().toISOString()}).eq("id",P.qid);
    S.pre=null;await loadQs();viewAdd();$("msg").textContent="Salvo ✓";};
  $("sq").onclick=async()=>{
    const name=$("desc").value.trim();
    if(!name)return $("msg").textContent="Preencha a descrição: ela será o nome do atalho.";
    if(S.qs.some(q=>q.name.toLowerCase()===name.toLowerCase()))return $("msg").textContent="Já existe um atalho com esse nome.";
    const acc=$("acc").value;
    const {data,error}=await sb.from("quick_entries").insert({household_id:S.hid,name,kind:S.kind,category_id:$("cat").value||null,default_account_id:acc}).select("id").single();
    if(error)return $("msg").textContent="Erro: "+error.message;
    await sb.from("quick_entry_accounts").insert({quick_entry_id:data.id,user_id:S.uid,household_id:S.hid,account_id:acc});
    const v=num($("v").value);
    S.pre={qid:data.id,cat:$("cat").value,acc,desc:name,amt:v>0?v:null};
    await loadQs();viewAdd();$("msg").textContent="Atalho criado ⭐";};
}

function viewQs(){
  const an=id=>S.accounts.find(a=>a.id===id)?.name||"—";
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Atalhos</b>
  ${S.qs.length?S.qs.map(q=>`<div class="row" style="display:block">
   <div><b>${esc(q.name)}</b> <span class="mu">${q.kind==="expense"?"despesa":"receita"} · ${esc(S.cats.find(c=>c.id===q.category_id)?.name||"—")} · ${q.use_count}x</span></div>
   <label>Minha conta neste atalho<select data-acc="${q.id}"><option value="">(padrão geral: ${esc(an(q.default_account_id))})</option>${S.accounts.map(a=>`<option value="${a.id}" ${a.id===S.qa[q.id]?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <label>Valor padrão (opcional)<input data-amt="${q.id}" inputmode="decimal" placeholder="0,00" value="${fa(q.default_amount)}"></label>
   <div style="margin-top:8px"><button data-fav="${q.id}">${q.is_favorite?"⭐ Favorito":"☆ Favoritar"}</button> <button data-arc="${q.id}">Arquivar</button></div></div>`).join(""):'<p class="mu">Nenhum atalho ainda. Na tela Lançar, preencha um lançamento e toque em "Salvar como atalho".</p>'}</div>
  <p id="qmsg" class="neg"></p>`;
  const fail=e=>{if(e)$("qmsg").textContent="Erro: "+e.message;return !!e;};
  $("bk").onclick=()=>go("add");
  document.querySelectorAll("[data-acc]").forEach(el=>el.onchange=async()=>{
    const id=el.dataset.acc;
    const r=el.value?await sb.from("quick_entry_accounts").upsert({quick_entry_id:id,user_id:S.uid,household_id:S.hid,account_id:el.value})
      :await sb.from("quick_entry_accounts").delete().eq("quick_entry_id",id).eq("user_id",S.uid);
    if(fail(r.error))return;
    if(el.value)S.qa[id]=el.value;else delete S.qa[id];});
  document.querySelectorAll("[data-amt]").forEach(el=>el.onchange=async()=>{
    const v=num(el.value),id=el.dataset.amt;
    const {error}=await sb.from("quick_entries").update({default_amount:v>0?v:null}).eq("id",id);
    if(fail(error))return;
    S.qs.find(q=>q.id===id).default_amount=v>0?v:null;el.value=v>0?fa(v):"";});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=async()=>{
    const q=S.qs.find(x=>x.id===b.dataset.fav);
    const {error}=await sb.from("quick_entries").update({is_favorite:!q.is_favorite}).eq("id",q.id);
    if(fail(error))return;await loadQs();viewQs();});
  document.querySelectorAll("[data-arc]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Arquivar este atalho? Os lançamentos já feitos não mudam."))return;
    const {error}=await sb.from("quick_entries").update({is_active:false}).eq("id",b.dataset.arc);
    if(fail(error))return;await loadQs();viewQs();});
}

async function viewList(){
  const {data,error}=await sb.from("transactions")
    .select("id,date,amount,currency,description,status,installment_number,installment_total,categories(name),accounts!inner(name,household_id)")
    .eq("accounts.household_id",S.hid)
    .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(50);
  if(error){$("main").innerHTML=`<div class="card neg">${esc(error.message)}</div>`;return;}
  $("main").innerHTML=`<div class="card">${data.length?data.map(t=>`<div class="row"><div>
    <div>${esc(t.description||t.categories?.name||"Sem descrição")}${t.installment_total?` <span class="mu">${t.installment_number}/${t.installment_total}</span>`:""}</div>
    <div class="mu">${t.date.split("-").reverse().join("/")} · ${esc(t.categories?.name||"—")} · ${esc(t.accounts?.name)}${t.status==="planned"?" · previsto":""}</div></div>
    <div><span class="${t.amount<0?"neg":"pos"}">${fmt(t.amount,t.currency)}</span><button class="x" data-del="${t.id}">✕</button></div></div>`).join(""):'<span class="mu">Nenhum lançamento ainda.</span>'}</div>`;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(confirm("Apagar este lançamento?")){await sb.from("transactions").delete().eq("id",b.dataset.del);viewList();}});
}

async function viewAcc(){
  const [{data:bal},{data:h}]=await Promise.all([
    sb.from("account_balances").select("*").eq("household_id",S.hid).order("name"),
    sb.from("households").select("invite_code").eq("id",S.hid).single()]);
  $("main").innerHTML=`<div class="card"><b>Contas</b>${(bal||[]).map(a=>`<div class="row"><div>${esc(a.name)}<div class="mu">${TYPES[a.type]}</div></div><div>${fmt(a.balance,a.currency)}</div></div>`).join("")||'<p class="mu">Nenhuma conta.</p>'}</div>
  <div class="card"><b>Nova conta</b>
   <label>Nome<input id="an"></label>
   <label>Tipo<select id="at">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
   <label>Moeda (3 letras)<input id="ac" value="BRL" maxlength="3"></label>
   <label>Cartão: dia de fechamento<input id="acl" type="number" min="1" max="31"></label>
   <label>Cartão: dia de vencimento<input id="adu" type="number" min="1" max="31"></label>
   <button class="pri" id="ads">Adicionar</button><p id="amsg" class="neg"></p></div>
  <div class="card mu">Código de convite da família: <b>${esc(h?.invite_code)}</b><br><br><button id="out">Sair</button></div>`;
  $("ads").onclick=async()=>{
    const {error}=await sb.from("accounts").insert({household_id:S.hid,name:$("an").value,type:$("at").value,
      currency:$("ac").value.toUpperCase(),closing_day:+$("acl").value||null,due_day:+$("adu").value||null});
    if(error)return $("amsg").textContent=error.message;
    await loadRef();viewAcc();};
  $("out").onclick=()=>sb.auth.signOut();
}
sb.auth.getSession().then(({data:{session}})=>session?start():show("login"));
</script>
</body>
</html>
