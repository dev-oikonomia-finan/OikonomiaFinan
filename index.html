<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDKs do Firebase (Versão compatível com navegador via CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-shadow shadow-md py-4 px-6 text-white flex justify-between items-center">
        <h1 class="text-xl font-bold">?? Finanças Pessoais & Família</h1>
        <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">Modo Online (Firebase)</span>
    </header>

    <!-- Container Principal -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Coluna Esquerda: Formulário de Lançamento Rápido (Perfeito para Celular) -->
        <section class="bg-white p-5 rounded-2xl shadow-sm md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-indigo-900 border-b pb-2">Novo Lançamento</h2>

            <form id="transacao-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Tipo</label>
                    <select id="tipo" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="despesa">Despesa ??</option>
                        <option value="receita">Receita ??</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Supermercado, Salário..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" required placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Categoria</label>
                    <select id="categoria" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Investimentos">Investimentos</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Data</label>
                    <input type="date" id="data" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md">
                    Salvar Lançamento
                </button>
            </form>
        </section>

        <!-- Coluna Direita: Resumo e Histórico (Perfeito para Computador) -->
        <section class="bg-white p-5 rounded-2xl shadow-sm md:col-span-2 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-indigo-900 border-b pb-2">Histórico de Lançamentos</h2>

                <!-- Tabela de Transações -->
                <div class="overflow-x-auto max-h-[400px]">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b">
                                <th class="p-3">Data</th>
                                <th class="p-3">Descrição</th>
                                <th class="p-3">Categoria</th>
                                <th class="p-3 text-right">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="lista-transacoes" class="divide-y divide-slate-100 text-sm">
                            <!-- Os dados do Firebase entram aqui dinamicamente -->
                            <tr>
                                <td colspan="4" class="p-4 text-center text-slate-400">Carregando dados do Firebase...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Rodapé da Seção com Resumo Rápido -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center bg-slate-50 p-4 rounded-xl">
                <span class="text-sm font-medium text-slate-600">Total Registrado:</span>
                <span id="total-geral" class="text-xl font-bold text-slate-800">R$ 0,00</span>
            </div>
        </section>

    </main>

    <!-- Script de Configuração e Lógica -->
    <script>
        // 1. COLE SUAS CONFIGURAÇÕES DO FIREBASE ABAIXO:
        const firebaseConfig = {
            apiKey: "AIzaSyBKuWLImE1Y98vBXsR4sYacbQp87rIvn3o",
            authDomain: "oikonomiafin4n.firebaseapp.com",
            projectId: "oikonomiafin4n",
            storageBucket: "oikonomiafin4n.firebasestorage.app",
            messagingSenderId: "885380415405",
            appId: "1:885380415405:web:54e9050238a807914c2b24"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Preenche a data de hoje automaticamente no formulário
        document.getElementById('data').valueAsDate = new Date();

        // 2. SALVAR TRANSAÇÃO NO FIREBASE
        const form = document.getElementById('transacao-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const novaTransacao = {
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                categoria: document.getElementById('categoria').value,
                data: document.getElementById('data').value,
                criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Salva na coleção "transacoes" do Firestore
                await db.collection('transacoes').add(novaTransacao);
                form.reset();
                document.getElementById('data').valueAsDate = new Date(); // Reseta data para hoje
            } catch (error) {
                console.error("Erro ao salvar transação: ", error);
                alert("Erro ao salvar. Verifique o console.");
            }
        });

        // 3. OUVIR E CARREGAR DADOS DO FIREBASE EM TEMPO REAL
        const listaTransacoesEl = document.getElementById('lista-transacoes');
        const totalGeralEl = document.getElementById('total-geral');

        db.collection('transacoes').orderBy('data', 'desc').onSnapshot((snapshot) => {
            let html = '';
            let somaTotal = 0;

            if (snapshot.empty) {
                listaTransacoesEl.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Nenhum lançamento encontrado.</td></tr>`;
                totalGeralEl.innerText = "R$ 0,00";
                return;
            }

            snapshot.forEach((doc) => {
                const t = doc.data();
                const valorFormatado = t.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const corValor = t.tipo === 'receita' ? 'text-emerald-600' : 'text-rose-600';
                const sinal = t.tipo === 'receita' ? '+' : '-';

                // Calcula saldo acumulado simples
                if (t.tipo === 'receita') {
                    somaTotal += t.valor;
                } else {
                    somaTotal -= t.valor;
                }

                html += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-slate-500">${t.data.split('-').reverse().join('/')}</td>
                        <td class="p-3 font-medium">${t.descricao}</td>
                        <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs">${t.categoria}</span></td>
                        <td class="p-3 text-right font-bold ${corValor}">${sinal} ${valorFormatado}</td>
                    </tr>
                `;
            });

            listaTransacoesEl.innerHTML = html;
            totalGeralEl.innerText = somaTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalGeralEl.className = `text-xl font-bold ${somaTotal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
        });
    </script>
</body>
</html>
