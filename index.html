<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>Oikonomia-Finan</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d1f;--mu:#6b7378;--ac:#0f766e;--red:#b42318;--grn:#067647;--bd:#e3e6e8;--yel:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#111415;--card:#1b1f21;--tx:#eceff0;--mu:#99a2a7;--ac:#2dd4bf;--red:#f97066;--grn:#47cd89;--bd:#2c3236;--yel:#fec84b}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 80px}
h1{font-size:1.2rem;margin:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#hb{font-size:.8rem;padding:6px 10px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main,.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-top:10px}
input,select{width:100%;font:inherit;padding:11px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);border-radius:10px;padding:11px 14px;background:var(--card);color:var(--tx)}
.pri{width:100%;margin-top:14px;background:var(--ac);color:#fff;border:0;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;min-width:0;padding:11px 4px;font-size:.92rem}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:.85rem}.neg{color:var(--red)}.pos{color:var(--grn)}
.x{padding:2px 8px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips button{padding:8px 12px;border-radius:20px}
.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx)!important;font-size:1rem!important}.ck input{width:auto;margin:0}
.sec{width:100%;margin-top:8px}.lk{border:0;background:none;color:var(--mu);padding:8px 0;margin-top:4px;font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px 0;font-size:.72rem;color:var(--mu)}nav button span{display:block;font-size:1.25rem;line-height:1.3}nav .on{color:var(--ac);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
details summary{padding:8px 0;color:var(--mu)}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1><span>🏠 Oikonomia-Finan</span><button id="hb" hidden></button></h1>

<div id="login" class="wrap" hidden><form id="lf" class="card">
  <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
  <label>Senha<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="pri">Entrar</button><p id="lmsg" class="neg"></p>
</form></div>

<div id="onboard" class="wrap" hidden>
  <div class="card"><b>Primeiro acesso: criar a família</b>
    <label>Nome da família<input id="hn" value="Nossa família"></label>
    <label>Seu nome<input id="mn"></label>
    <button class="pri" id="mk">Criar família</button></div>
  <div class="card"><b>Ou entrar numa família existente</b>
    <label>Código de convite<input id="cd"></label>
    <label>Seu nome<input id="mn2"></label>
    <button class="pri" id="jn">Entrar</button></div>
  <p id="omsg" class="neg"></p>
</div>

<div id="app" hidden><main id="main"></main>
<nav><button data-t="dash"><span>📊</span>Painel</button><button data-t="add"><span>➕</span>Lançar</button><button data-t="list"><span>📋</span>Lançamentos</button><button data-t="acc"><span>🏦</span>Contas</button></nav></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qjsqgujcsjxhvjumpbtd.supabase.co";
const SUPABASE_KEY="sb_publishable_pxLDAve7JSVg-R0Pv5hPWQ__X33phlf";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,c)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:(c||"BRL").trim()}).format(v);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const num=s=>{s=s.trim();return s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s)};
const TYPES={checking:"Conta corrente",cash:"Dinheiro",credit_card:"Cartão de crédito",investment:"Investimento",loan:"Empréstimo",financing:"Financiamento",fgts:"FGTS",pension:"Previdência",other:"Outra"};
let S={tr:null,qs:[],qa:{},pre:null,uid:null,hs:[],hid:null,accounts:[],cats:[],kind:"expense",tab:"dash",rt:false,lastAcc:null,ed:null,par:null,fAcc:null,lim:50,trFrom:"acc",catsAll:[],ce:null,me:null,catFrom:"acc",cmsg:"",loans:[],parFrom:"list",pmsg:"",antId:null};
const show=v=>{["login","onboard","app"].forEach(x=>$(x).hidden=x!==v);$("hb").hidden=v!=="app";};

$("lf").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  error?$("lmsg").textContent="E-mail ou senha incorretos.":start();};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.hid=null;show("login");}});

async function loadHouseholds(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return null;
  S.uid=user.id;
  const {data}=await sb.from("household_members").select("household_id,households(name)").eq("user_id",user.id);
  S.hs=(data||[]).map(m=>({id:m.household_id,name:m.households?.name||"Família"}));
  return user;
}
async function start(prevIds){
  const user=await loadHouseholds();
  if(!user)return show("login");
  if(!S.hs.length)return show("onboard");
  const novo=prevIds&&S.hs.find(h=>!prevIds.includes(h.id));
  let saved=null;try{saved=localStorage.getItem("hid")}catch(e){}
  const h=novo||S.hs.find(h=>h.id===S.hid)||S.hs.find(h=>h.id===saved)||S.hs[0];
  await pick(h.id,true);subscribe();
}
async function pick(id,keep){
  S.hid=id;S.lastAcc=null;S.pre=null;S.ed=null;S.par=null;S.fAcc=null;S.lim=50;S.parFrom="list";S.antId=null;
  try{localStorage.setItem("hid",id)}catch(e){}
  $("hb").textContent="⇄ "+S.hs.find(x=>x.id===id).name;
  show("app");await loadRef();go(keep&&["dash","add","list","acc"].includes(S.tab)?S.tab:"dash");
}
async function loadRef(){
  const [a]=await Promise.all([
    sb.from("accounts").select("*").eq("household_id",S.hid).eq("is_active",true).order("name"),loadCats()]);
  S.accounts=a.data||[];await Promise.all([loadQs(),loadLoans()]);
}
async function loadLoans(){
  const {data}=await sb.from("loan_contracts").select("*").eq("household_id",S.hid);
  S.loans=data||[];
}
async function loadCats(){
  const {data}=await sb.from("categories").select("*").eq("household_id",S.hid).order("name");
  S.catsAll=data||[];S.cats=S.catsAll.filter(c=>c.is_active);
}
const catById=id=>S.catsAll.find(c=>c.id===id);
const catLabel=c=>{const p=c.parent_id&&catById(c.parent_id);return p?p.name+" › "+c.name:c.name;};
const catName=id=>{const c=catById(id);return c?catLabel(c):"—";};
const catSort=list=>list.slice().sort((a,b)=>{
  const pa=a.parent_id&&catById(a.parent_id),pb=b.parent_id&&catById(b.parent_id);
  return (pa?pa.name:a.name).localeCompare(pb?pb.name:b.name,"pt-BR")||((pa?1:0)-(pb?1:0))||a.name.localeCompare(b.name,"pt-BR");});
function catOpts(kind,sel,empty){
  let list=S.cats.filter(c=>c.kind===kind);
  const cur=sel&&catById(sel);
  if(cur&&cur.kind===kind&&!cur.is_active)list=list.concat(cur);
  return (empty?'<option value="">(sem categoria)</option>':"")+catSort(list).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(catLabel(c))}${c.is_active?"":" (arquivada)"}</option>`).join("");
}
const fa=v=>v==null?"":String(v).replace(".",",");
async function loadQs(){
  const [q,m]=await Promise.all([
    sb.from("quick_entries").select("*").eq("household_id",S.hid).eq("is_active",true),
    sb.from("quick_entry_accounts").select("quick_entry_id,account_id").eq("household_id",S.hid).eq("user_id",S.uid)]);
  S.qs=(q.data||[]).sort((a,b)=>(b.is_favorite-a.is_favorite)||(b.use_count-a.use_count)||a.name.localeCompare(b.name));
  S.qa=Object.fromEntries((m.data||[]).map(r=>[r.quick_entry_id,r.account_id]));
}
function subscribe(){if(S.rt)return;S.rt=true;
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"transactions"},()=>{if(S.tab==="list")viewList();}).subscribe();}

async function onb(fn,args,msgId){
  const prev=S.hs.map(h=>h.id);
  const {error}=await sb.rpc(fn,args);
  error?$(msgId).textContent=error.message:start(prev);}
$("mk").onclick=()=>onb("create_household",{p_name:$("hn").value,p_display_name:$("mn").value},"omsg");
$("jn").onclick=()=>onb("join_household",{p_code:$("cd").value.trim(),p_display_name:$("mn2").value},"omsg");
$("hb").onclick=()=>go("fam");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.t==="list")S.lim=50;go(b.dataset.t);});
const NAVOF=t=>({qs:"add",ed:"list",par:S.parFrom==="loans"?"dash":"list",loans:"dash",ant:"dash",metas:"dash",cat:S.catFrom==="metas"?"dash":"acc",cated:S.catFrom==="metas"?"dash":"acc",tr:S.trFrom==="add"?"add":"acc"})[t]||t;
function go(t){S.tab=t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===NAVOF(t)));
  ({dash:viewDash,add:viewAdd,list:viewList,acc:viewAcc,fam:viewFam,qs:viewQs,tr:viewTr,ed:viewEdit,par:viewPar,loans:viewLoans,ant:viewAnt,cat:viewCat,cated:viewCatEdit,metas:viewMetas})[t]();}

function viewFam(){
  $("main").innerHTML=`<div class="card"><b>Minhas famílias</b>${S.hs.map(h=>`<div class="row"><div>${esc(h.name)}${h.id===S.hid?' <span class="mu">(atual)</span>':""}</div>${h.id===S.hid?"":`<button data-sw="${h.id}">Trocar</button>`}</div>`).join("")}</div>
  <div class="card"><b>Criar nova família</b><div class="mu">Ex.: uma família de testes/demonstração</div>
   <label>Nome da família<input id="fn" value="Família de teste"></label>
   <label>Seu nome nela<input id="fm"></label>
   <button class="pri" id="fk">Criar e entrar</button></div>
  <div class="card"><b>Entrar com código de convite</b>
   <label>Código<input id="fc"></label>
   <label>Seu nome nela<input id="fm2"></label>
   <button class="pri" id="fj">Entrar</button></div>
  <p id="fmsg" class="neg"></p>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>pick(b.dataset.sw));
  $("fk").onclick=()=>onb("create_household",{p_name:$("fn").value,p_display_name:$("fm").value},"fmsg");
  $("fj").onclick=()=>onb("join_household",{p_code:$("fc").value.trim(),p_display_name:$("fm2").value},"fmsg");
}

function viewAdd(){
  if(!S.accounts.length){$("main").innerHTML='<div class="card">Cadastre uma conta primeiro, na aba <b>Contas</b>.</div>';return;}
  const P=S.pre||{};
  const cats=S.cats.filter(c=>c.kind===S.kind);
  const badCat=!!P.cat&&!cats.some(c=>c.id===P.cat);
  const qs=S.qs.filter(q=>q.kind===S.kind);
  const accSel=P.acc||S.lastAcc;
  $("main").innerHTML=`<div class="card">
   <div class="seg"><button data-k="expense" class="${S.kind==="expense"?"on":""}">Despesa</button><button data-k="income" class="${S.kind==="income"?"on":""}">Receita</button><button data-k="tr">Transferência</button></div>
   ${qs.length?`<div class="chips">${qs.map(q=>`<button data-q="${q.id}" class="${P.qid===q.id?"on":""}">${q.is_favorite?"⭐ ":""}${esc(q.name)}</button>`).join("")}</div>`:""}
   <button class="lk" id="mq">⚙ Gerenciar atalhos</button>
   <label><span id="vt">Valor</span><input id="v" inputmode="decimal" placeholder="0,00" value="${fa(P.amt)}"></label>
   ${S.kind==="expense"?`<label class="ck"><input type="checkbox" id="pc"> Compra parcelada</label>
   <div id="pcw" hidden><label>Nº de parcelas<input id="pn" type="number" min="2" max="48" value="2"></label><p id="pv" class="mu"></p></div>`:""}
   <label>Categoria<select id="cat">${badCat?'<option value="" selected>Escolha a categoria</option>':""}${catOpts(S.kind,badCat?null:P.cat)}</select></label>
   <label>Conta / cartão<select id="acc">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===accSel?"selected":""}>${esc(a.name)} (${a.currency.trim()})</option>`).join("")}</select></label>
   <div id="pin"></div>
   <label>Descrição<input id="desc" value="${esc(P.desc||"")}"></label>
   <label>Data<input id="dt" type="date" value="${esc(P.dt||today())}"></label>
   ${P.qid?"":'<label class="ck"><input type="checkbox" id="fl"> ⭐ Salvar também como atalho</label>'}
   <button class="pri" id="save">Salvar</button><p id="msg" class="mu"></p></div>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="tr"){S.tr=null;S.trFrom="add";return go("tr");}
    S.kind=b.dataset.k;S.pre=null;viewAdd();});
  $("mq").onclick=()=>go("qs");
  const pv=()=>{if(!$("pc"))return;const on=$("pc").checked;$("pcw").hidden=!on;$("vt").textContent=on?"Valor total":"Valor";
    const n=parseInt($("pn").value),v=num($("v").value),c=S.accounts.find(a=>a.id===$("acc").value).currency.trim();
    $("pv").textContent=on&&n>=2&&v>0?`${n}x de aprox. ${fmt(v/n,c)} (1ª parcela na data informada)`:"";};
  ["pc","pn","v","acc"].forEach(i=>{if($(i)){$(i).oninput=pv;$(i).onchange=i==="acc"?$(i).onchange:pv;}});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const q=S.qs.find(x=>x.id===b.dataset.q);
    if(P.qid===q.id){
      const d=$("desc").value;
      S.pre={cat:$("cat").value,acc:$("acc").value,amt:$("v").value,desc:d.trim()===q.name?"":d,dt:$("dt").value};
      viewAdd();$("desc").focus();return;}
    const ok=id=>S.accounts.some(a=>a.id===id)?id:null;
    S.pre={qid:q.id,cat:q.category_id,acc:ok(S.qa[q.id])||ok(q.default_account_id)||S.lastAcc,desc:q.name,amt:q.default_amount};
    viewAdd();$("v").focus();});
  $("acc").onchange=()=>{
    pv();
    if(!P.qid||$("acc").value===S.qa[P.qid]){$("pin").innerHTML="";return;}
    $("pin").innerHTML='<button class="lk" id="pb">📌 Usar esta conta como minha neste atalho</button>';
    $("pb").onclick=async()=>{const acc=$("acc").value;
      const {error}=await sb.from("quick_entry_accounts").upsert({quick_entry_id:P.qid,user_id:S.uid,household_id:S.hid,account_id:acc});
      if(error)return $("msg").textContent="Erro: "+error.message;
      S.qa[P.qid]=acc;P.acc=acc;$("pin").innerHTML="";$("msg").textContent="Conta fixada ✓";};};
  $("save").onclick=async()=>{
    const val=num($("v").value);
    if(!(val>0))return $("msg").textContent="Informe um valor válido.";
    if($("cat").value===""&&cats.length)return $("msg").textContent="Escolha a categoria.";
    if(!$("dt").value)return $("msg").textContent="Informe a data.";
    const n=$("pc")&&$("pc").checked?parseInt($("pn").value):0;
    if(n&&!(n>=2&&n<=48))return $("msg").textContent="Informe de 2 a 48 parcelas.";
    const mkq=!!($("fl")&&$("fl").checked),qname=$("desc").value.trim();
    if(mkq){
      if(!qname)return $("msg").textContent="Para salvar como atalho, preencha a descrição: ela será o nome do atalho.";
      if(S.qs.some(q=>q.name.toLowerCase()===qname.toLowerCase()))return $("msg").textContent="Já existe um atalho com esse nome. Mude a descrição ou desmarque a opção de atalho.";
    }
    S.lastAcc=$("acc").value;
    const cat=$("cat").value||null,dt=$("dt").value;
    $("save").disabled=true;
    const r=n?await sb.rpc("create_installments",{p_account_id:S.lastAcc,p_first_date:dt,p_total:val,p_n:n,
        p_category_id:cat,p_description:$("desc").value||null})
      :await sb.from("transactions").insert({account_id:S.lastAcc,date:dt,
        amount:S.kind==="expense"?-val:val,category_id:cat,description:$("desc").value||null,
        status:dt>today()?"planned":"posted"});
    if(r.error){$("save").disabled=false;return $("msg").textContent="Erro: "+r.error.message;}
    let extra="";
    if(mkq){
      const q=await sb.from("quick_entries").insert({household_id:S.hid,name:qname,kind:S.kind,category_id:cat,
        default_account_id:S.lastAcc,use_count:1,last_used_at:new Date().toISOString()}).select("id").single();
      if(q.error)extra=" (o atalho NÃO foi criado: "+q.error.message+")";
      else{
        const m=await sb.from("quick_entry_accounts").insert({quick_entry_id:q.data.id,user_id:S.uid,household_id:S.hid,account_id:S.lastAcc});
        extra=m.error?" (atalho criado, mas sem fixar sua conta: "+m.error.message+")":" · atalho criado ⭐";}
    }
    if(P.qid)await sb.from("quick_entries").update({use_count:(S.qs.find(x=>x.id===P.qid)?.use_count||0)+1,last_used_at:new Date().toISOString()}).eq("id",P.qid);
    S.pre=null;await loadQs();viewAdd();$("msg").textContent=(n?`Parcelado em ${n}x ✓`:"Salvo ✓")+extra;};
}

function viewQs(){
  const an=id=>S.accounts.find(a=>a.id===id)?.name||"—";
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Atalhos</b>
  ${S.qs.length?S.qs.map(q=>`<div class="row" style="display:block">
   <div><b>${esc(q.name)}</b> <span class="mu">${q.kind==="expense"?"despesa":"receita"} · ${esc(catName(q.category_id))} · ${q.use_count}x</span></div>
   <label>Minha conta neste atalho<select data-acc="${q.id}"><option value="">(padrão geral: ${esc(an(q.default_account_id))})</option>${S.accounts.map(a=>`<option value="${a.id}" ${a.id===S.qa[q.id]?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <label>Valor padrão (opcional)<input data-amt="${q.id}" inputmode="decimal" placeholder="0,00" value="${fa(q.default_amount)}"></label>
   <div style="margin-top:8px"><button data-fav="${q.id}">${q.is_favorite?"⭐ Favorito":"☆ Favoritar"}</button> <button data-arc="${q.id}">Arquivar</button></div></div>`).join(""):'<p class="mu">Nenhum atalho ainda. Na tela Lançar, preencha um lançamento e toque em "Salvar como atalho".</p>'}</div>
  <p id="qmsg" class="neg"></p>`;
  const fail=e=>{if(e)$("qmsg").textContent="Erro: "+e.message;return !!e;};
  $("bk").onclick=()=>go("add");
  document.querySelectorAll("[data-acc]").forEach(el=>el.onchange=async()=>{
    const id=el.dataset.acc;
    const r=el.value?await sb.from("quick_entry_accounts").upsert({quick_entry_id:id,user_id:S.uid,household_id:S.hid,account_id:el.value})
      :await sb.from("quick_entry_accounts").delete().eq("quick_entry_id",id).eq("user_id",S.uid);
    if(fail(r.error))return;
    if(el.value)S.qa[id]=el.value;else delete S.qa[id];});
  document.querySelectorAll("[data-amt]").forEach(el=>el.onchange=async()=>{
    const v=num(el.value),id=el.dataset.amt;
    const {error}=await sb.from("quick_entries").update({default_amount:v>0?v:null}).eq("id",id);
    if(fail(error))return;
    S.qs.find(q=>q.id===id).default_amount=v>0?v:null;el.value=v>0?fa(v):"";});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=async()=>{
    const q=S.qs.find(x=>x.id===b.dataset.fav);
    const {error}=await sb.from("quick_entries").update({is_favorite:!q.is_favorite}).eq("id",q.id);
    if(fail(error))return;await loadQs();viewQs();});
  document.querySelectorAll("[data-arc]").forEach(b=>b.onclick=async()=>{

function viewTr(){
  const T=S.tr||{};
  const nc=S.accounts.filter(a=>a.type!=="credit_card");
  const from=T.from||(nc[0]||S.accounts[0]).id;
  const to=T.to||(S.accounts.find(a=>a.id!==from)||S.accounts[0]).id;
  const opt=sel=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} (${a.currency.trim()})</option>`).join("");
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>${T.pay?"Pagar fatura":"Transferir entre contas"}</b>
   <label>De (origem)<select id="tf">${opt(from)}</select></label>
   <label>Para (destino)<select id="tt">${opt(to)}</select></label>
   <label>Valor<input id="tv" inputmode="decimal" placeholder="0,00" value="${fa(T.amt)}"></label>
   <label id="tw" hidden>Valor recebido (na moeda do destino)<input id="tx" inputmode="decimal" placeholder="0,00"></label>
   <label>Data<input id="td" type="date" value="${today()}"></label>
   <label>Descrição<input id="tds" value="${esc(T.desc||"")}"></label>
   <button class="pri" id="ts">Confirmar</button><p id="tm" class="neg"></p>
   ${T.pay?'<p class="mu">O valor sugerido é a dívida total do cartão. Ajuste para o valor da fatura, se for diferente.</p>':""}</div>`;
  const cur=id=>S.accounts.find(a=>a.id===id).currency.trim();
  const sync=()=>{$("tw").hidden=cur($("tf").value)===cur($("tt").value);};
  $("tf").onchange=sync;$("tt").onchange=sync;sync();
  $("bk").onclick=()=>go(S.trFrom||"acc");
  $("ts").onclick=async()=>{
    const f=$("tf").value,t=$("tt").value,v=num($("tv").value);
    if(f===t)return $("tm").textContent="Origem e destino devem ser diferentes.";
    if(!(v>0))return $("tm").textContent="Informe um valor válido.";
    const diff=cur(f)!==cur(t),vt=diff?num($("tx").value):null;
    if(diff&&!(vt>0))return $("tm").textContent="Informe o valor recebido.";
    $("ts").disabled=true;
    const {error}=await sb.rpc("create_transfer",{p_from:f,p_to:t,p_amount:v,p_date:$("td").value,
      p_description:$("tds").value.trim()||(T.pay?"Pagamento de fatura":"Transferência"),p_amount_to:vt});
    if(error){$("ts").disabled=false;return $("tm").textContent="Erro: "+error.message;}
    S.tr=null;go(S.trFrom||"acc");};
}

function drawEdit(t,D){
  const tr=!!t.transfer_group_id,pa=!!t.installment_group_id,cur=t.currency.trim(),lo=pa?S.loans.find(l=>l.installment_group_id===t.installment_group_id):null;

  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Editar lançamento</b>
   ${tr?'<p class="mu">Transferência: só data e descrição podem ser editadas, e a mudança vale para as duas pontas. Para corrigir valor ou contas, apague e refaça a transferência.</p>'
     :lo?`<p class="mu">Parcela ${t.installment_number}/${t.installment_total} do contrato <b>${esc(lo.name)}</b>. Informe o valor realmente cobrado pela instituição.</p>`
     :pa?`<p class="mu">Parcela ${t.installment_number}/${t.installment_total}. A conta vale para a compra toda. Alterar o valor muda o total da compra.</p>`:""}
   ${tr||pa?"":`<div class="seg"><button data-k="expense" class="${D.kind==="expense"?"on":""}">Despesa</button><button data-k="income" class="${D.kind==="income"?"on":""}">Receita</button></div>`}
   <label>Valor (${esc(cur)})<input id="ev" inputmode="decimal" value="${esc(D.val)}" ${tr?"disabled":""}></label>
   ${tr?"":`<label>Categoria<select id="ec">${catOpts(D.kind,D.cat,true)}</select></label>`}
   <label>Conta / cartão<select id="ea" ${tr||(pa&&!lo)?"disabled":""}>${accs.map(a=>`<option value="${a.id}" ${a.id===D.acc?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <label>Descrição<input id="edsc" value="${esc(D.desc)}"></label>
   <label>Data<input id="edt" type="date" value="${esc(D.date)}"></label>
   ${lo?`<label class="ck"><input type="checkbox" id="efol" ${D.fol?"checked":""}> Se trocar a conta, aplicar também às parcelas seguintes ainda previstas</label>`:""}
   ${pa?`<label class="ck"><input type="checkbox" id="eall" ${D.all?"checked":""}> Aplicar categoria e descrição a todas as parcelas ${lo?"do contrato":"desta compra"}</label>
     <button class="lk" id="epar">Editar todas as parcelas ${lo?"do contrato":"desta compra"}</button>`:""}

    if($("ec"))D.cat=$("ec").value;if($("ea"))D.acc=$("ea").value;if($("eall"))D.all=$("eall").checked;if($("efol"))D.fol=$("efol").checked;};
  $("bk").onclick=()=>go("list");

  $("es").onclick=async()=>{
    const v=num($("ev").value),date=$("edt").value;
    if(!tr&&!(v>0))return $("emsg").textContent="Informe um valor válido.";
    if(!date)return $("emsg").textContent="Informe a data.";

    $("es").disabled=true;

    if(tr)r=await sb.from("transactions").update({date,description:desc,status:st}).eq("transfer_group_id",t.transfer_group_id);
    else{
      const u={amount:D.kind==="expense"?-v:v,date,category_id:$("ec").value||null,description:desc,status:st};
      if(!pa)u.account_id=$("ea").value;

        r=await sb.from("transactions").update({category_id:u.category_id,description:desc}).eq("installment_group_id",t.installment_group_id);
      if(!r.error&&lo&&$("ea").value!==t.account_id)
        r=await sb.rpc("change_loan_account",{p_contract_id:lo.id,p_installment_number:t.installment_number,p_account_id:$("ea").value,p_following:$("efol").checked,p_set_default:false});

async function viewPar(msg){
  if(msg===undefined)msg=S.pmsg;S.pmsg="";
  const {data,error}=await sb.from("transactions")
    .select("id,date,amount,currency,description,status,installment_number,installment_total,categories(name),accounts(name)")
    .eq("installment_group_id",S.par).order("installment_number");
  if(error||!data||!data.length){S.par=null;return go(S.parFrom==="loans"?"loans":"list");}
  const lo=S.loans.find(l=>l.installment_group_id===S.par);
  const cur=data[0].currency.trim(),sign=data[0].amount<0?-1:1;
  const cents=t=>Math.round(Math.abs(t.amount)*100);
  const orig=data.reduce((s,t)=>s+cents(t),0);
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>${lo?"Parcelas do contrato":"Parcelas da compra"}</b>
   <div class="mu">${esc(lo?lo.name:(data[0].description||"Sem descrição"))} · ${esc(data[0].categories?.name||"—")} · ${esc(data[0].accounts?.name)}</div>
   ${lo?'<p class="mu">Valores previstos são estimativas. Corrija cada parcela com o valor e a data realmente cobrados pela instituição.</p>':""}
   ${data.map(t=>`<div class="row" style="display:block"><b>${t.installment_number}/${t.installment_total}</b>
     <span class="mu">${t.status==="planned"&&t.date>today()?"previsto":(lo?"paga":"lançada")}</span>
     <div style="display:flex;gap:8px"><input type="date" data-pd="${t.id}" value="${t.date}"><input data-pv="${t.id}" inputmode="decimal" value="${f2(t.amount)}"></div></div>`).join("")}
   <p id="ps" class="mu"></p>
   ${lo?"":'<button class="sec" id="pj">Ajustar última parcela para fechar o total original</button>'}
   <button class="pri" id="psv">Salvar parcelas</button>
   ${lo?"":'<button class="sec neg" id="pdel">Apagar compra inteira</button>'}
   <p id="pm" class="neg">${esc(msg||"")}</p>
   ${lo?"":`<p class="mu">Total original = soma das parcelas ao abrir esta tela (${fmt(orig/100,cur)}).</p>`}</div>`;
  const vals=()=>[...document.querySelectorAll("[data-pv]")].map(el=>Math.round(num(el.value)*100));
  const calc=()=>{const v=vals();if(v.some(x=>!(x>0))){$("ps").textContent="Há valor inválido.";return;}
    const s=v.reduce((a,b)=>a+b,0),d=s-orig;
    $("ps").textContent=lo?`Soma das parcelas: ${fmt(s/100,cur)}`
      :`Soma ${fmt(s/100,cur)} · original ${fmt(orig/100,cur)} · `+(d===0?"total confere ✓":`diferença ${d>0?"+":"-"}${fmt(Math.abs(d)/100,cur)}`);};
  document.querySelectorAll("[data-pv]").forEach(el=>el.oninput=calc);calc();
  $("bk").onclick=()=>go(S.parFrom==="loans"?"loans":"list");
  if($("pj"))$("pj").onclick=()=>{const els=[...document.querySelectorAll("[data-pv]")],v=vals();
    const resto=orig-v.slice(0,-1).reduce((a,b)=>a+b,0);
    if(!(resto>0))return $("pm").textContent="Não é possível: as outras parcelas já passam do total original.";
    els[els.length-1].value=f2(resto/100);$("pm").textContent="";calc();};
  $("psv").onclick=async()=>{
    const v=vals();
    if(v.some(x=>!(x>0)))return $("pm").textContent="Informe valores válidos em todas as parcelas.";
    const ds=[...document.querySelectorAll("[data-pd]")].map(el=>el.value);
    if(ds.some(d=>!d))return $("pm").textContent="Informe a data de todas as parcelas.";
    $("psv").disabled=true;let n=0;
    for(let i=0;i<data.length;i++){
      const t=data[i];
      if(v[i]===cents(t)&&ds[i]===t.date)continue;
      const {error}=await sb.from("transactions").update({amount:sign*v[i]/100,date:ds[i],status:ds[i]>today()?"planned":"posted"}).eq("id",t.id);
      if(error)return viewPar(`Erro na parcela ${t.installment_number}/${t.installment_total}: ${error.message}. A tela mostra o que está salvo.`);
      n++;}
    viewPar(n?`${n} parcela(s) salva(s) ✓`:"Nada foi alterado.");};
  if($("pdel"))$("pdel").onclick=async()=>{
    if(!confirm(`Apagar a compra inteira (${data.length} parcelas)? Isso não pode ser desfeito.`))return;
    const {error}=await sb.from("transactions").delete().eq("installment_group_id",S.par);
    if(error)return $("pm").textContent="Erro: "+error.message;
    S.par=null;go("list");};
}

   <label>Quais<select id="xw"><option value="next">As próximas</option><option value="last">As últimas</option></select></label>
   <label>Valor total pago (o que a instituição cobrou)<input id="xv" inputmode="decimal" placeholder="0,00"></label>
   <label>Data do pagamento<input id="xd" type="date" value="${today()}" max="${today()}"></label>

  const pv=()=>{const S2=sel(),v=num($("xv").value);if(!S2){$("xp").textContent="";return;}
    const prev=S2.reduce((a,t)=>a-Number(t.amount),0);

  if(error){$("main").innerHTML=`<div class="card neg">${esc(error.message)}</div>`;return;}
  const E=S.me?data.find(b=>b.id===S.me):null;if(S.me&&!E)S.me=null;

  const fd=x=>x?x.split("-").reverse().join("/"):"";
  const lab=b=>b.category_id?(()=>{const c=catById(b.category_id);return c?catLabel(c)+(c.is_active?"":" (arquivada)"):"Categoria removida";})():"Total geral";
  const L=data.slice().sort((a,b)=>ORD[a.period]-ORD[b.period]||(a.category_id?1:0)-(b.category_id?1:0)||lab(a).localeCompare(lab(b),"pt-BR"));

   ${L.length?L.map(b=>`<div class="row"><div><div>${esc(lab(b))}</div><div class="mu">${PN[b.period]} · a partir de ${fd(b.valid_from)}${b.valid_to?" até "+fd(b.valid_to):""}</div></div>
     <div style="text-align:right;white-space:nowrap">${mm(b.amount)}<button class="x" data-me="${b.id}">✏️</button><button class="x" data-md="${b.id}">✕</button></div></div>`).join(""):'<p class="mu">Nenhuma meta ainda. Use o formulário abaixo.</p>'}</div>
  <div class="card"><b>${E?"Editar meta":"Nova meta"}</b>
   <label>Categoria<select id="mc"><option value="">Total geral</option>${catOpts("expense",E?E.category_id:null)}</select></label>
   <label>Período<select id="mp">${Object.entries(PN).map(([k,v])=>`<option value="${k}" ${(E?E.period:"monthly")===k?"selected":""}>${v[0].toUpperCase()+v.slice(1)}</option>`).join("")}</select></label>
   <label>Valor da meta (R$)<input id="ma" inputmode="decimal" placeholder="0,00" value="${E?f2(E.amount):""}"></label>
   <label>Válida a partir de<input id="mf" type="date" value="${E?E.valid_from:today().slice(0,8)+"01"}"></label>
   <label>Válida até (opcional)<input id="mt" type="date" value="${E?.valid_to||""}"></label>
   <button class="pri" id="ms">${E?"Salvar alterações":"Adicionar meta"}</button>
   ${E?'<button class="sec" id="mx">Cancelar edição</button>':""}
   <p id="mm2" class="${msg?"pos":"neg"}">${esc(msg||"")}</p>
   <p class="mu">Uma meta numa categoria-mãe soma também as subcategorias. Meta sem categoria é o "Total geral" de despesas.</p>
   <button class="lk" id="mgc">🏷 Gerenciar categorias</button></div>`;
  $("bk").onclick=()=>{S.me=null;go("dash");};
  $("mgc").onclick=()=>{S.catFrom="metas";go("cat");};
  if($("mx"))$("mx").onclick=()=>{S.me=null;viewMetas();};
  document.querySelectorAll("[data-me]").forEach(b=>b.onclick=async()=>{S.me=b.dataset.me;await viewMetas();window.scrollTo(0,document.body.scrollHeight);});
  document.querySelectorAll("[data-md]").forEach(b=>b.onclick=async()=>{
    const m=data.find(x=>x.id===b.dataset.md);
    if(!confirm(`Apagar a meta "${lab(m)}" (${PN[m.period]})?`))return;
    const {error}=await sb.from("budgets").delete().eq("id",m.id);
    if(error)return alert("Erro: "+error.message);
    if(S.me===m.id)S.me=null;
    viewMetas("Meta apagada ✓");});
  $("ms").onclick=async()=>{
    const v=num($("ma").value),vf=$("mf").value,vt=$("mt").value||null,cat=$("mc").value||null,per=$("mp").value;
    const say=t=>{$("mm2").className="neg";$("mm2").textContent=t;};
    if(!(v>0))return say("Informe um valor maior que zero.");
    if(!vf)return say("Informe a data de início.");
    if(vt&&vt<vf)return say('"Válida até" não pode ser anterior a "Válida a partir de".');
    const dup=data.find(b=>b.id!==(E&&E.id)&&(b.category_id||null)===cat&&b.period===per&&vf<=(b.valid_to||"9999-12-31")&&b.valid_from<=(vt||"9999-12-31"));
    if(dup)return say("Já existe uma meta para essa categoria e período nessas datas. Edite a existente.");
    $("ms").disabled=true;
    const row={category_id:cat,period:per,amount:v,valid_from:vf,valid_to:vt};
    const {error}=E?await sb.from("budgets").update(row).eq("id",E.id):await sb.from("budgets").insert({household_id:S.hid,...row});
    if(error){$("ms").disabled=false;return say("Erro: "+error.message);}
    S.me=null;viewMetas(E?"Meta atualizada ✓":"Meta criada ✓");};
}

/* ================= CATEGORIAS ================= */
const catDup=(name,kind,par,except)=>S.catsAll.some(c=>c.is_active&&c.id!==except&&c.kind===kind&&(c.parent_id||null)===(par||null)&&c.name.trim().toLowerCase()===name.trim().toLowerCase());
const motherOpts=(kind,sel,excl)=>'<option value="">(nenhuma: categoria principal)</option>'+catSort(S.catsAll.filter(c=>c.kind===kind&&!c.parent_id&&c.id!==excl&&(c.is_active||c.id===sel))).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}${c.is_active?"":" (arquivada)"}</option>`).join("");

async function viewCat(){
  await loadCats();
  const msg=S.cmsg;S.cmsg="";
  const act=S.catsAll.filter(c=>c.is_active),ids=new Set(act.map(c=>c.id)),arq=catSort(S.catsAll.filter(c=>!c.is_active));
  const roots=k=>catSort(act.filter(c=>c.kind===k&&(!c.parent_id||!ids.has(c.parent_id))));
  const kids=id=>catSort(act.filter(c=>c.parent_id===id));
  const row=(c,lv)=>`<div class="row" style="padding-left:${lv*22}px"><div>${lv?"↳ ":""}${esc(lv?c.name:catLabel(c))}</div><button class="x" data-ce="${c.id}">✏️</button></div>`;
  const sec=(k,t)=>`<div class="card"><b>${t}</b>${roots(k).map(r=>row(r,0)+kids(r.id).map(c=>row(c,1)).join("")).join("")||'<p class="mu">Nenhuma.</p>'}</div>`;
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Categorias</b>
   <label>Nome<input id="cn" placeholder="Ex.: Combustível"></label>
   <label>Tipo<select id="ck"><option value="expense">Despesa</option><option value="income">Receita</option></select></label>
   <label>Categoria-mãe (para criar uma subcategoria)<select id="cm">${motherOpts("expense")}</select></label>
   <button class="pri" id="ca">Adicionar categoria</button><p id="cmsg" class="${msg?"pos":"neg"}">${esc(msg)}</p></div>
  ${sec("expense","Despesas")}${sec("income","Receitas")}
  ${arq.length?`<div class="card"><details><summary>Arquivadas (${arq.length})</summary>${arq.map(c=>`<div class="row"><div>${esc(catLabel(c))} <span class="mu">${c.kind==="expense"?"despesa":"receita"}</span></div><button class="x" data-re="${c.id}">Reativar</button></div>`).join("")}</details></div>`:""}`;
  const say=t=>{$("cmsg").className="neg";$("cmsg").textContent=t;};
  $("bk").onclick=()=>go(S.catFrom==="metas"?"metas":"acc");
  $("ck").onchange=()=>{$("cm").innerHTML=motherOpts($("ck").value);};
  document.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>{S.ce=b.dataset.ce;go("cated");});
  $("ca").onclick=async()=>{
    const name=$("cn").value.trim(),kind=$("ck").value,par=$("cm").value||null;
    if(!name)return say("Informe o nome da categoria.");
    if(par){const p=catById(par);if(!p||p.parent_id||p.kind!==kind||!p.is_active)return say("Categoria-mãe inválida.");}
    if(catDup(name,kind,par))return say("Já existe uma categoria com esse nome nesse lugar.");
    $("ca").disabled=true;
    const {error}=await sb.from("categories").insert({household_id:S.hid,name,kind,parent_id:par});
    if(error){$("ca").disabled=false;return say("Erro: "+error.message);}
    S.cmsg=`"${name}" criada ✓`;viewCat();};
  document.querySelectorAll("[data-re]").forEach(b=>b.onclick=async()=>{
    const c=catById(b.dataset.re),p=c.parent_id&&catById(c.parent_id);
    if(p&&!p.is_active)return say(`Reative primeiro a categoria-mãe "${p.name}".`);
    if(catDup(c.name,c.kind,c.parent_id,c.id))return say("Já existe uma categoria ativa com esse nome nesse lugar.");
    const {error}=await sb.from("categories").update({is_active:true}).eq("id",c.id);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" reativada ✓`;viewCat();});
}

   ${filhas.length?`<p class="mu">Esta categoria tem ${filhas.length} subcategoria(s), por isso não pode virar subcategoria de outra. O tipo (despesa ou receita) não pode ser mudado.</p>`:'<p class="mu">O tipo (despesa ou receita) não pode ser mudado.</p>'}
   <button class="pri" id="cs">Salvar alterações</button>
   <button class="sec" id="cr">${c.is_active?"Arquivar":"Reativar"}</button>
   <button class="sec neg" id="cdel">Apagar de vez</button>
   <p id="cmsg" class="neg"></p></div>`;
  const say=t=>{$("cmsg").textContent=t;};
  $("bk").onclick=()=>go("cat");
  const cnt=async(t,col)=>{const r=await sb.from(t).select("id",{count:"exact",head:true}).eq(col,c.id);return r.error?null:(r.count||0);};
  $("cs").onclick=async()=>{
    const name=$("cn").value.trim(),par=$("cm").value||null;
    if(!name)return say("Informe o nome da categoria.");
    if(par){const p=catById(par);if(!p||p.parent_id||p.kind!==c.kind||par===c.id)return say("Categoria-mãe inválida.");if(filhas.length)return say("Esta categoria tem subcategorias e não pode virar subcategoria.");}
    if(c.is_active&&catDup(name,c.kind,par,c.id))return say("Já existe uma categoria com esse nome nesse lugar.");
    $("cs").disabled=true;
    const {error}=await sb.from("categories").update({name,parent_id:par}).eq("id",c.id);
    if(error){$("cs").disabled=false;return say("Erro: "+error.message);}
    S.cmsg="Categoria atualizada ✓";go("cat");};
  $("cr").onclick=async()=>{
    if(!c.is_active){
      const p=c.parent_id&&catById(c.parent_id);
      if(p&&!p.is_active)return say(`Reative primeiro a categoria-mãe "${p.name}".`);
      if(catDup(c.name,c.kind,c.parent_id,c.id))return say("Já existe uma categoria ativa com esse nome nesse lugar.");
      const {error}=await sb.from("categories").update({is_active:true}).eq("id",c.id);
      if(error)return say("Erro: "+error.message);
      S.cmsg=`"${c.name}" reativada ✓`;return go("cat");}
    const idsA=[c.id,...ativas.map(x=>x.id)];
    const nb=await sb.from("budgets").select("id",{count:"exact",head:true}).in("category_id",idsA);
    const txt=`Arquivar "${c.name}"${ativas.length?` e suas ${ativas.length} subcategoria(s)`:""}? Some do Lançar e das metas novas; os lançamentos antigos mantêm o nome.`+(nb.count?` Existem ${nb.count} meta(s) ligada(s): elas continuam existindo (apague em Metas se quiser).`:"");
    if(!confirm(txt))return;
    const {error}=await sb.from("categories").update({is_active:false}).in("id",idsA);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" arquivada ✓`;go("cat");};
  $("cdel").onclick=async()=>{
    if(filhas.length)return say(`Tem ${filhas.length} subcategoria(s) (inclusive arquivadas). Apague-as antes, ou arquive esta categoria.`);
    const [t,b,q]=await Promise.all([cnt("transactions","category_id"),cnt("budgets","category_id"),cnt("quick_entries","category_id")]);
    if(t==null||b==null||q==null)return say("Não consegui verificar o uso da categoria. Tente de novo.");
    if(t)return say(`Tem ${t} lançamento(s). Arquive em vez de apagar.`);
    if(b)return say(`Tem ${b} meta(s) ligada(s). Apague as metas ou arquive a categoria.`);
    if(q)return say(`É usada em ${q} atalho(s). Arquive em vez de apagar.`);
    if(!confirm(`Apagar "${c.name}" de vez? Isso não pode ser desfeito.`))return;
    const {error}=await sb.from("categories").delete().eq("id",c.id);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" apagada ✓`;S.ce=null;go("cat");};
}

sb.auth.getSession().then(({data:{session}})=>session?start():show("login"));
</script>
