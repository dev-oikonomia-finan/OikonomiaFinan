<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>Oikonomia-Finan</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d1f;--mu:#6b7378;--ac:#0f766e;--red:#b42318;--grn:#067647;--bd:#e3e6e8;--yel:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#111415;--card:#1b1f21;--tx:#eceff0;--mu:#99a2a7;--ac:#2dd4bf;--red:#f97066;--grn:#47cd89;--bd:#2c3236;--yel:#fec84b}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 80px}
h1{font-size:1.2rem;margin:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#hb{font-size:.8rem;padding:6px 10px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main,.wrap{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-top:10px}
input,select,textarea{width:100%;font:inherit;padding:11px;margin-top:4px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);border-radius:10px;padding:11px 14px;background:var(--card);color:var(--tx)}
.pri{width:100%;margin-top:14px;background:var(--ac);color:#fff;border:0;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;min-width:0;padding:11px 4px;font-size:.92rem}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:.85rem}.neg{color:var(--red)}.pos{color:var(--grn)}
.x{padding:2px 8px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips button{padding:8px 12px;border-radius:20px}
.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx)!important;font-size:1rem!important}.ck input{width:auto;margin:0}
.sec{width:100%;margin-top:8px}.lk{border:0;background:none;color:var(--mu);padding:8px 0;margin-top:4px;font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px 0;font-size:.72rem;color:var(--mu)}nav button span{display:block;font-size:1.25rem;line-height:1.3}nav .on{color:var(--ac);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
details summary{padding:8px 0;color:var(--mu)}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1><span>🏠 Oikonomia-Finan</span><button id="hb" hidden></button></h1>

<div id="login" class="wrap" hidden><form id="lf" class="card">
  <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
  <label>Senha<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="pri">Entrar</button><p id="lmsg" class="neg"></p>
</form></div>

<div id="onboard" class="wrap" hidden>
  <div class="card"><b>Primeiro acesso: criar a família</b>
    <label>Nome da família<input id="hn" value="Nossa família"></label>
    <label>Seu nome<input id="mn"></label>
    <button class="pri" id="mk">Criar família</button></div>
  <div class="card"><b>Ou entrar numa família existente</b>
    <label>Código de convite<input id="cd"></label>
    <label>Seu nome<input id="mn2"></label>
    <button class="pri" id="jn">Entrar</button></div>
  <p id="omsg" class="neg"></p>
</div>

<div id="app" hidden><main id="main"></main>
<nav><button data-t="dash"><span>📊</span>Painel</button><button data-t="add"><span>➕</span>Lançar</button><button data-t="list"><span>📋</span>Lançamentos</button><button data-t="acc"><span>🏦</span>Contas</button></nav></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qjsqgujcsjxhvjumpbtd.supabase.co";
const SUPABASE_KEY="sb_publishable_pxLDAve7JSVg-R0Pv5hPWQ__X33phlf";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,c)=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:(c||"BRL").trim()}).format(v);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const num=s=>{s=s.trim();return s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s)};
const TYPES={checking:"Conta corrente",cash:"Dinheiro",credit_card:"Cartão de crédito",investment:"Investimento",loan:"Empréstimo",financing:"Financiamento",fgts:"FGTS",pension:"Previdência",other:"Outra",benefit:"Benefício (vale)"};
let S={tr:null,qs:[],qa:{},pre:null,uid:null,hs:[],hid:null,accounts:[],cats:[],kind:"expense",tab:"dash",rt:false,lastAcc:null,ed:null,par:null,fAcc:null,lim:50,trFrom:"acc",catsAll:[],ce:null,me:null,catFrom:"acc",cmsg:"",loans:[],parFrom:"list",pmsg:"",antId:null,cards:[],lper:"mon",lmon:null,fatAcc:null,fatMon:null,cloAcc:null,cloMon:null,acmId:null,holders:[],fatH:null,wallets:[],wbal:{},intl:{},dper:"mon",dfrom:null,dto:null,splashDone:false,vid:null};
const show=v=>{["login","onboard","app"].forEach(x=>$(x).hidden=x!==v);$("hb").hidden=v!=="app";};

$("lf").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  error?$("lmsg").textContent="E-mail ou senha incorretos.":start();};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.hid=null;S.splashDone=false;show("login");}});

async function loadHouseholds(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return null;
  S.uid=user.id;
  const {data}=await sb.from("household_members").select("household_id,households(name)").eq("user_id",user.id);
  S.hs=(data||[]).map(m=>({id:m.household_id,name:m.households?.name||"Família"}));
  return user;
}
async function start(prevIds){
  const user=await loadHouseholds();
  if(!user)return show("login");
  if(!S.hs.length)return show("onboard");
  const novo=prevIds&&S.hs.find(h=>!prevIds.includes(h.id));
  let saved=null;try{saved=localStorage.getItem("hid")}catch(e){}
  const h=novo||S.hs.find(h=>h.id===S.hid)||S.hs.find(h=>h.id===saved)||S.hs[0];
  await pick(h.id,true);subscribe();
}
async function pick(id,keep){
  S.hid=id;S.lastAcc=null;S.pre=null;S.ed=null;S.par=null;S.fAcc=null;S.lim=50;S.parFrom="list";S.antId=null;S.fatAcc=null;S.fatMon=null;S.lmon=null;S.cloAcc=null;S.cloMon=null;S.acmId=null;S.fatH=null;
  try{localStorage.setItem("hid",id)}catch(e){}
  $("hb").textContent="⇄ "+S.hs.find(x=>x.id===id).name;
  show("app");const first=!S.splashDone;S.splashDone=true;const rp=loadRef();if(first)await splash();await rp;go(keep&&["dash","add","list","acc"].includes(S.tab)?S.tab:"dash");
}
async function loadRef(){
  const [a]=await Promise.all([
    sb.from("accounts").select("*").eq("household_id",S.hid).eq("is_active",true).order("name"),loadCats()]);
  S.accounts=a.data||[];await Promise.all([loadQs(),loadLoans(),loadCards(),loadWallets()]);
}
async function loadLoans(){
  const {data}=await sb.from("loan_contracts").select("*").eq("household_id",S.hid);
  S.loans=data||[];
}
async function loadCards(){
  const [c,h]=await Promise.all([sb.from("credit_cards").select("*").eq("household_id",S.hid),sb.from("card_holders").select("*").eq("household_id",S.hid).order("name")]);
  S.cards=c.data||[];S.holders=h.data||[];
}
async function loadWallets(){
  const [w,b]=await Promise.all([sb.from("wallets").select("*").eq("household_id",S.hid).order("name"),sb.from("wallet_balances").select("wallet_id,balance").eq("household_id",S.hid)]);
  S.wallets=w.data||[];S.wbal={};(b.data||[]).forEach(r=>{S.wbal[r.wallet_id]=Number(r.balance);});
}
const walletsOf=id=>S.wallets.filter(w=>w.account_id===id&&w.is_active);
const walletName=id=>(S.wallets.find(w=>w.id===id)||{}).name||"";
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const walWhen=w=>w.credit_month?"em "+MESES[w.credit_month-1]:"todo mês";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
// modo do cartão nos resumos: "stm" = pelo mês da fatura (padrão) | "buy" = pela data da compra
const cm=()=>lsGet("cardmode")==="buy"?"buy":"stm";
// Lançamentos, Todas as contas: "date" = por data (padrão) | "acc" = agrupado por conta
const lg=()=>lsGet("listgrp")==="acc"?"acc":"date";
const holdersOf=id=>S.holders.filter(h=>h.account_id===id&&h.is_active);
const holderName=id=>(S.holders.find(h=>h.id===id)||{}).name||"";
async function loadCats(){
  const {data}=await sb.from("categories").select("*").eq("household_id",S.hid).order("name");
  S.catsAll=data||[];S.cats=S.catsAll.filter(c=>c.is_active);
}
const catById=id=>S.catsAll.find(c=>c.id===id);
const catLabel=c=>{const p=c.parent_id&&catById(c.parent_id);return p?p.name+" › "+c.name:c.name;};
const catName=id=>{const c=catById(id);return c?catLabel(c):"—";};
const catSort=list=>list.slice().sort((a,b)=>{
  const pa=a.parent_id&&catById(a.parent_id),pb=b.parent_id&&catById(b.parent_id);
  return (pa?pa.name:a.name).localeCompare(pb?pb.name:b.name,"pt-BR")||((pa?1:0)-(pb?1:0))||a.name.localeCompare(b.name,"pt-BR");});
function catOpts(kind,sel,empty){
  let list=S.cats.filter(c=>c.kind===kind);
  const cur=sel&&catById(sel);
  if(cur&&cur.kind===kind&&!cur.is_active)list=list.concat(cur);
  return (empty?'<option value="">(sem categoria)</option>':"")+catSort(list).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(catLabel(c))}${c.is_active?"":" (arquivada)"}</option>`).join("");
}
const fa=v=>v==null?"":String(v).replace(".",",");
const mAdd=(m,n)=>{const d=new Date(m+"T12:00:00");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";};
const mlab=m=>new Date(m+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
/* mês da fatura = mês do vencimento (espelha card_statement_month do banco) */
const stm=(c,d)=>{const [y,mo,dd]=d.split("-").map(Number),dim=new Date(y,mo,0).getDate(),x=new Date(y,mo-1,1);
  if(dd>Math.min(c.closing_day,dim))x.setMonth(x.getMonth()+1);
  if(c.due_day<=c.closing_day)x.setMonth(x.getMonth()+1);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-01";};
async function loadQs(){
  const [q,m]=await Promise.all([
    sb.from("quick_entries").select("*").eq("household_id",S.hid).eq("is_active",true),
    sb.from("quick_entry_accounts").select("quick_entry_id,account_id").eq("household_id",S.hid).eq("user_id",S.uid)]);
  S.qs=(q.data||[]).sort((a,b)=>(b.is_favorite-a.is_favorite)||(b.use_count-a.use_count)||a.name.localeCompare(b.name));
  S.qa=Object.fromEntries((m.data||[]).map(r=>[r.quick_entry_id,r.account_id]));
}
function subscribe(){if(S.rt)return;S.rt=true;
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"transactions"},()=>{if(S.tab==="list")viewList();}).subscribe();}

async function onb(fn,args,msgId){
  const prev=S.hs.map(h=>h.id);
  const {error}=await sb.rpc(fn,args);
  error?$(msgId).textContent=error.message:start(prev);}
$("mk").onclick=()=>onb("create_household",{p_name:$("hn").value,p_display_name:$("mn").value},"omsg");
$("jn").onclick=()=>onb("join_household",{p_code:$("cd").value.trim(),p_display_name:$("mn2").value},"omsg");
$("hb").onclick=()=>go("fam");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.t==="list")S.lim=50;go(b.dataset.t);});
const NAVOF=t=>({qs:"add",ed:"list",par:S.parFrom==="loans"?"dash":"list",loans:"dash",ant:"dash",metas:"dash",cat:S.catFrom==="metas"?"dash":"acc",cated:S.catFrom==="metas"?"dash":"acc",tr:S.trFrom==="add"?"add":"acc",fat:"acc",clo:"acc",acm:"acc",ver:"acc",inv:"acc",intl:"acc"})[t]||t;
function go(t){S.tab=t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===NAVOF(t)));
  ({dash:viewDash,add:viewAdd,list:viewList,acc:viewAcc,fam:viewFam,qs:viewQs,tr:viewTr,ed:viewEdit,par:viewPar,loans:viewLoans,ant:viewAnt,cat:viewCat,cated:viewCatEdit,metas:viewMetas,fat:viewFat,clo:viewClo,acm:viewAcm,ver:viewVer,inv:viewInv,intl:viewIntl})[t]();}

function viewFam(){
  $("main").innerHTML=`<div class="card"><b>Minhas famílias</b>${S.hs.map(h=>`<div class="row"><div>${esc(h.name)}${h.id===S.hid?' <span class="mu">(atual)</span>':""}</div>${h.id===S.hid?"":`<button data-sw="${h.id}">Trocar</button>`}</div>`).join("")}</div>
  <div class="card"><b>Criar nova família</b><div class="mu">Ex.: uma família de testes/demonstração</div>
   <label>Nome da família<input id="fn" value="Família de teste"></label>
   <label>Seu nome nela<input id="fm"></label>
   <button class="pri" id="fk">Criar e entrar</button></div>
  <div class="card"><b>Entrar com código de convite</b>
   <label>Código<input id="fc"></label>
   <label>Seu nome nela<input id="fm2"></label>
   <button class="pri" id="fj">Entrar</button></div>
  <p id="fmsg" class="neg"></p>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>pick(b.dataset.sw));
  $("fk").onclick=()=>onb("create_household",{p_name:$("fn").value,p_display_name:$("fm").value},"fmsg");
  $("fj").onclick=()=>onb("join_household",{p_code:$("fc").value.trim(),p_display_name:$("fm2").value},"fmsg");
}

function viewAdd(){
  if(!S.accounts.length){$("main").innerHTML='<div class="card">Cadastre uma conta primeiro, na aba <b>Contas</b>.</div>';return;}
  const P=S.pre||{};
  const cats=S.cats.filter(c=>c.kind===S.kind);
  const badCat=!!P.cat&&!cats.some(c=>c.id===P.cat);
  const qs=S.qs.filter(q=>q.kind===S.kind);
  const accSel=P.acc||S.lastAcc;
  $("main").innerHTML=`<div class="card">
   <div class="seg"><button data-k="expense" class="${S.kind==="expense"?"on":""}">Despesa</button><button data-k="income" class="${S.kind==="income"?"on":""}">Receita</button><button data-k="tr">Transferência</button></div>
   ${qs.length?`<div class="chips">${qs.map(q=>`<button data-q="${q.id}" class="${P.qid===q.id?"on":""}">${q.is_favorite?"⭐ ":""}${esc(q.name)}</button>`).join("")}</div>`:""}
   <button class="lk" id="mq">⚙ Gerenciar atalhos</button>
   <label><span id="vt">Valor</span><input id="v" inputmode="decimal" placeholder="0,00" value="${fa(P.amt)}"></label>
   <div id="fxw" hidden></div><p id="fxi" class="mu"></p>
   ${S.kind==="expense"?`<label class="ck" id="pcl"><input type="checkbox" id="pc"> Compra parcelada</label>
   <div id="pcw" hidden><label>Nº de parcelas<input id="pn" type="number" min="2" max="48" value="2"></label><p id="pv" class="mu"></p></div>`:""}
   <label>Categoria<select id="cat">${badCat?'<option value="" selected>Escolha a categoria</option>':""}${catOpts(S.kind,badCat?null:P.cat)}</select></label>
   <label>Conta / cartão<select id="acc">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===accSel?"selected":""}>${esc(a.name)} (${a.currency.trim()})</option>`).join("")}</select></label>
   <label id="hw" hidden>Portador<select id="hd"></select></label><label id="ww" hidden>Carteira<select id="wl"></select></label><p id="wm" class="mu"></p><div id="pin"></div>
   <label>Descrição<input id="desc" value="${esc(P.desc||"")}"></label>
   <label>Data<input id="dt" type="date" value="${esc(P.dt||today())}"></label><p id="fh" class="mu"></p>
   ${P.qid?"":'<label class="ck"><input type="checkbox" id="fl"> ⭐ Salvar também como atalho</label>'}
   <button class="pri" id="save">Salvar</button><p id="msg" class="mu"></p></div>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="tr"){S.tr=null;S.trFrom="add";return go("tr");}
    S.kind=b.dataset.k;S.pre=null;viewAdd();});
  $("mq").onclick=()=>go("qs");
  const pv=()=>{if(!$("pc"))return;const on=$("pc").checked;$("pcw").hidden=!on;$("vt").textContent=on?"Valor total":"Valor";
    const n=parseInt($("pn").value),v=num($("v").value),c=S.accounts.find(a=>a.id===$("acc").value).currency.trim();
    $("pv").textContent=on&&n>=2&&v>0?`${n}x de aprox. ${fmt(v/n,c)} (1ª parcela na data informada)`:"";};
  ["pc","pn","v","acc"].forEach(i=>{if($(i)){$(i).oninput=pv;$(i).onchange=i==="acc"?$(i).onchange:pv;}});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const q=S.qs.find(x=>x.id===b.dataset.q);
    if(P.qid===q.id){
      const d=$("desc").value;
      S.pre={cat:$("cat").value,acc:$("acc").value,amt:$("v").value,desc:d.trim()===q.name?"":d,dt:$("dt").value,wal:$("wl").value};
      viewAdd();$("desc").focus();return;}
    const ok=id=>S.accounts.some(a=>a.id===id)?id:null;
    S.pre={qid:q.id,cat:q.category_id,acc:ok(S.qa[q.id])||ok(q.default_account_id)||S.lastAcc,desc:q.name,amt:q.default_amount};
    viewAdd();$("v").focus();});
  const fh=()=>{const c=S.cards.find(x=>x.account_id===$("acc").value),d=$("dt").value;$("fh").textContent=c&&d?"Entra na fatura de "+mlab(stm(c,d)):"";};
  $("dt").oninput=fh;fh();
  const hd=()=>{const L=holdersOf($("acc").value);$("hw").hidden=L.length<2;let sv=null;try{sv=localStorage.getItem("hold_"+$("acc").value)}catch(e){}
    $("hd").innerHTML=L.map(h=>`<option value="${h.id}" ${h.id===sv?"selected":""}>${esc(h.name)}</option>`).join("");};hd();
  const wv=()=>{const a=S.accounts.find(x=>x.id===$("acc").value);
    if(!a||a.type!=="benefit"){$("wm").textContent="";return;}
    if(!$("wl").value){$("wm").textContent="Nenhuma carteira nesta conta. Crie em Contas > ⚙ da conta.";return;}
    const bal=S.wbal[$("wl").value]||0,val=num($("v").value);
    $("wm").textContent=S.kind==="expense"&&val>bal?`⚠️ Saldo da carteira: ${fmt(bal,a.currency)}. Esta compra é maior (faltam ${fmt(val-bal,a.currency)}). Você pode salvar mesmo assim.`:"";};
  const wl=()=>{const a=S.accounts.find(x=>x.id===$("acc").value),ben=!!a&&a.type==="benefit";
    $("ww").hidden=!ben;const fo=!!a&&a.currency.trim()!=="BRL";if($("pcl")){$("pcl").hidden=ben||fo;if((ben||fo)&&$("pc").checked){$("pc").checked=false;pv();}}
    if(!ben){$("wm").textContent="";return;}
    const L=walletsOf(a.id),cur=$("wl").value||P.wal||lsGet("wal_"+a.id)||"";
    $("wl").innerHTML=L.length?L.map(w=>`<option value="${w.id}" ${w.id===cur?"selected":""}>${esc(w.name)} · ${fmt(S.wbal[w.id]||0,a.currency)}</option>`).join(""):'<option value="">(sem carteiras)</option>';
    wv();};
  const fxh=()=>{const a=S.accounts.find(x=>x.id===$("acc").value),p=$("fxi");if(!p)return;
    const c=a?a.currency.trim():"BRL";if(c==="BRL"){p.textContent="";return;}
    const I=S.intl[a.id];if(!I){p.textContent="Carregando custo médio…";return;}
    const v=num($("v").value)||0;

async function viewPar(msg){
  if(msg===undefined)msg=S.pmsg;S.pmsg="";
  const {data,error}=await sb.from("transactions")
    .select("id,date,amount,currency,description,status,installment_number,installment_total,categories(name),accounts(name)")
    .eq("installment_group_id",S.par).order("installment_number");
  if(error||!data||!data.length){S.par=null;return go(S.parFrom==="loans"?"loans":"list");}
  const lo=S.loans.find(l=>l.installment_group_id===S.par);
  const cur=data[0].currency.trim(),sign=data[0].amount<0?-1:1;
  const cents=t=>Math.round(Math.abs(t.amount)*100);
  const orig=data.reduce((s,t)=>s+cents(t),0);
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>${lo?"Parcelas do contrato":"Parcelas da compra"}</b>
   <div class="mu">${esc(lo?lo.name:(data[0].description||"Sem descrição"))} · ${esc(data[0].categories?.name||"—")} · ${esc(data[0].accounts?.name)}</div>
   ${lo?'<p class="mu">Valores previstos são estimativas. Corrija cada parcela com o valor e a data realmente cobrados pela instituição.</p>':""}
   ${data.map(t=>`<div class="row" style="display:block"><b>${t.installment_number}/${t.installment_total}</b>
     <span class="mu">${t.status==="planned"&&t.date>today()?"previsto":(lo?"paga":"lançada")}</span>
     <div style="display:flex;gap:8px"><input type="date" data-pd="${t.id}" value="${t.date}"><input data-pv="${t.id}" inputmode="decimal" value="${f2(t.amount)}"></div></div>`).join("")}
   <p id="ps" class="mu"></p>
   ${lo?"":'<button class="sec" id="pj">Ajustar última parcela para fechar o total original</button>'}
   <button class="pri" id="psv">Salvar parcelas</button>
   ${lo?"":'<button class="sec neg" id="pdel">Apagar compra inteira</button>'}
   <p id="pm" class="neg">${esc(msg||"")}</p>
   ${lo?"":`<p class="mu">Total original = soma das parcelas ao abrir esta tela (${fmt(orig/100,cur)}).</p>`}</div>`;
  const vals=()=>[...document.querySelectorAll("[data-pv]")].map(el=>Math.round(num(el.value)*100));
  const calc=()=>{const v=vals();if(v.some(x=>!(x>0))){$("ps").textContent="Há valor inválido.";return;}
    const s=v.reduce((a,b)=>a+b,0),d=s-orig;
    $("ps").textContent=lo?`Soma das parcelas: ${fmt(s/100,cur)}`
      :`Soma ${fmt(s/100,cur)} · original ${fmt(orig/100,cur)} · `+(d===0?"total confere ✓":`diferença ${d>0?"+":"-"}${fmt(Math.abs(d)/100,cur)}`);};
  document.querySelectorAll("[data-pv]").forEach(el=>el.oninput=calc);calc();
  $("bk").onclick=()=>go(S.parFrom==="loans"?"loans":"list");
  if($("pj"))$("pj").onclick=()=>{const els=[...document.querySelectorAll("[data-pv]")],v=vals();
    const resto=orig-v.slice(0,-1).reduce((a,b)=>a+b,0);
    if(!(resto>0))return $("pm").textContent="Não é possível: as outras parcelas já passam do total original.";
    els[els.length-1].value=f2(resto/100);$("pm").textContent="";calc();};
  $("psv").onclick=async()=>{
    const v=vals();
    if(v.some(x=>!(x>0)))return $("pm").textContent="Informe valores válidos em todas as parcelas.";
    const ds=[...document.querySelectorAll("[data-pd]")].map(el=>el.value);
    if(ds.some(d=>!d))return $("pm").textContent="Informe a data de todas as parcelas.";
    $("psv").disabled=true;let n=0;
    for(let i=0;i<data.length;i++){
      const t=data[i];
      if(v[i]===cents(t)&&ds[i]===t.date)continue;
      const {error}=await sb.from("transactions").update({amount:sign*v[i]/100,date:ds[i],status:ds[i]>today()?"planned":"posted"}).eq("id",t.id);
      if(error)return viewPar(`Erro na parcela ${t.installment_number}/${t.installment_total}: ${error.message}. A tela mostra o que está salvo.`);
      n++;}
    viewPar(n?`${n} parcela(s) salva(s) ✓`:"Nada foi alterado.");};
  if($("pdel"))$("pdel").onclick=async()=>{
    if(!confirm(`Apagar a compra inteira (${data.length} parcelas)? Isso não pode ser desfeito.`))return;
    const {error}=await sb.from("transactions").delete().eq("installment_group_id",S.par);
    if(error)return $("pm").textContent="Erro: "+error.message;
    S.par=null;go("list");};
}

      dt=$("ldt").value,amt=num($("lam").value),drop=kind==="sac"?(num($("ldr").value)||0):0;
    if(!name)return say("Informe o nome do contrato.");
    if(!(total>=1))return say("Informe o total de parcelas.");
    if(!(paid>=0&&paid<total))return say(`Parcelas já pagas deve ficar entre 0 e ${total-1}.`);
    if(!dt)return say("Informe a data da próxima parcela.");
    if(!(amt>0))return say("Informe o valor da próxima parcela.");
    if(drop<0)return say("A queda mensal não pode ser negativa.");
    if(kind==="sac"&&amt-(total-paid-1)*drop<=0)return say("Com essa queda, a última parcela ficaria zerada ou negativa. Confira a queda mensal.");
    $("ls").disabled=true;

      p_total_installments:total,p_paid_before:paid,p_first_date:dt,p_first_amount:amt,p_monthly_drop:drop});
    if(error){$("ls").disabled=false;return say("Erro: "+error.message);}
    viewLoans(`Contrato criado ✓ ${total-paid} parcela(s) geradas. Confira em "Ver parcelas".`);};
}

async function viewAnt(){

   <label>Quais<select id="xw"><option value="next">As próximas</option><option value="last">As últimas</option></select></label>

    if(error){$("xs").disabled=false;return say("Erro: "+error.message);}
    S.par=c.installment_group_id;S.parFrom="loans";S.pmsg=`${n} parcela(s) antecipada(s) ✓ Confira os valores abaixo e corrija o que for preciso.`;go("par");};

  if(error){$("main").innerHTML=`<div class="card neg">${esc(error.message)}</div>`;return;}
  const E=S.me?data.find(b=>b.id===S.me):null;if(S.me&&!E)S.me=null;

   ${L.length?L.map(b=>`<div class="row"><div><div>${esc(lab(b))}</div><div class="mu">${PN[b.period]} · a partir de ${fd(b.valid_from)}${b.valid_to?" até "+fd(b.valid_to):""}</div></div>

  <div class="card"><b>${E?"Editar meta":"Nova meta"}</b>
   <label>Categoria<select id="mc"><option value="">Total geral</option>${catOpts("expense",E?E.category_id:null)}</select></label>
   <label>Período<select id="mp">${Object.entries(PN).map(([k,v])=>`<option value="${k}" ${(E?E.period:"monthly")===k?"selected":""}>${v[0].toUpperCase()+v.slice(1)}</option>`).join("")}</select></label>
   <label>Valor da meta (R$)<input id="ma" inputmode="decimal" placeholder="0,00" value="${E?f2(E.amount):""}"></label>
   <label>Válida a partir de<input id="mf" type="date" value="${E?E.valid_from:today().slice(0,8)+"01"}"></label>
   <label>Válida até (opcional)<input id="mt" type="date" value="${E?.valid_to||""}"></label>
   <button class="pri" id="ms">${E?"Salvar alterações":"Adicionar meta"}</button>
   ${E?'<button class="sec" id="mx">Cancelar edição</button>':""}
   <p id="mm2" class="${msg?"pos":"neg"}">${esc(msg||"")}</p>
   <p class="mu">Uma meta numa categoria-mãe soma também as subcategorias. Meta sem categoria é o "Total geral" de despesas.</p>
   <button class="lk" id="mgc">🏷 Gerenciar categorias</button></div>`;
  $("bk").onclick=()=>{S.me=null;go("dash");};
  $("mgc").onclick=()=>{S.catFrom="metas";go("cat");};
  if($("mx"))$("mx").onclick=()=>{S.me=null;viewMetas();};
  document.querySelectorAll("[data-me]").forEach(b=>b.onclick=async()=>{S.me=b.dataset.me;await viewMetas();window.scrollTo(0,document.body.scrollHeight);});
  document.querySelectorAll("[data-md]").forEach(b=>b.onclick=async()=>{
    const m=data.find(x=>x.id===b.dataset.md);

    const {error}=await sb.from("budgets").delete().eq("id",m.id);

    if(S.me===m.id)S.me=null;
    viewMetas("Meta apagada ✓");});

    if(error){$("ms").disabled=false;return say("Erro: "+error.message);}
    S.me=null;viewMetas(E?"Meta atualizada ✓":"Meta criada ✓");};
}

const catDup=(name,kind,par,except)=>S.catsAll.some(c=>c.is_active&&c.id!==except&&c.kind===kind&&(c.parent_id||null)===(par||null)&&c.name.trim().toLowerCase()===name.trim().toLowerCase());
const motherOpts=(kind,sel,excl)=>'<option value="">(nenhuma: categoria principal)</option>'+catSort(S.catsAll.filter(c=>c.kind===kind&&!c.parent_id&&c.id!==excl&&(c.is_active||c.id===sel))).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}${c.is_active?"":" (arquivada)"}</option>`).join("");

async function viewCat(){
  await loadCats();
  const msg=S.cmsg;S.cmsg="";
  const act=S.catsAll.filter(c=>c.is_active),ids=new Set(act.map(c=>c.id)),arq=catSort(S.catsAll.filter(c=>!c.is_active));
  const roots=k=>catSort(act.filter(c=>c.kind===k&&(!c.parent_id||!ids.has(c.parent_id))));
  const kids=id=>catSort(act.filter(c=>c.parent_id===id));
  const row=(c,lv)=>`<div class="row" style="padding-left:${lv*22}px"><div>${lv?"↳ ":""}${esc(lv?c.name:catLabel(c))}</div><button class="x" data-ce="${c.id}">✏️</button></div>`;
  const sec=(k,t)=>`<div class="card"><b>${t}</b>${roots(k).map(r=>row(r,0)+kids(r.id).map(c=>row(c,1)).join("")).join("")||'<p class="mu">Nenhuma.</p>'}</div>`;
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Categorias</b>
   <label>Nome<input id="cn" placeholder="Ex.: Combustível"></label>
   <label>Tipo<select id="ck"><option value="expense">Despesa</option><option value="income">Receita</option></select></label>
   <label>Categoria-mãe (para criar uma subcategoria)<select id="cm">${motherOpts("expense")}</select></label>
   <button class="pri" id="ca">Adicionar categoria</button><p id="cmsg" class="${msg?"pos":"neg"}">${esc(msg)}</p></div>
  ${sec("expense","Despesas")}${sec("income","Receitas")}
  ${arq.length?`<div class="card"><details><summary>Arquivadas (${arq.length})</summary>${arq.map(c=>`<div class="row"><div>${esc(catLabel(c))} <span class="mu">${c.kind==="expense"?"despesa":"receita"}</span></div><button class="x" data-re="${c.id}">Reativar</button></div>`).join("")}</details></div>`:""}`;
  const say=t=>{$("cmsg").className="neg";$("cmsg").textContent=t;};
  $("bk").onclick=()=>go(S.catFrom==="metas"?"metas":"acc");
  $("ck").onchange=()=>{$("cm").innerHTML=motherOpts($("ck").value);};
  document.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>{S.ce=b.dataset.ce;go("cated");});
  $("ca").onclick=async()=>{
    const name=$("cn").value.trim(),kind=$("ck").value,par=$("cm").value||null;
    if(!name)return say("Informe o nome da categoria.");
    if(par){const p=catById(par);if(!p||p.parent_id||p.kind!==kind||!p.is_active)return say("Categoria-mãe inválida.");}
    if(catDup(name,kind,par))return say("Já existe uma categoria com esse nome nesse lugar.");
    $("ca").disabled=true;
    const {error}=await sb.from("categories").insert({household_id:S.hid,name,kind,parent_id:par});
    if(error){$("ca").disabled=false;return say("Erro: "+error.message);}
    S.cmsg=`"${name}" criada ✓`;viewCat();};
  document.querySelectorAll("[data-re]").forEach(b=>b.onclick=async()=>{
    const c=catById(b.dataset.re),p=c.parent_id&&catById(c.parent_id);
    if(p&&!p.is_active)return say(`Reative primeiro a categoria-mãe "${p.name}".`);
    if(catDup(c.name,c.kind,c.parent_id,c.id))return say("Já existe uma categoria ativa com esse nome nesse lugar.");
    const {error}=await sb.from("categories").update({is_active:true}).eq("id",c.id);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" reativada ✓`;viewCat();});
}

function viewCatEdit(){

    if(par){const p=catById(par);if(!p||p.parent_id||p.kind!==c.kind||par===c.id)return say("Categoria-mãe inválida.");if(filhas.length)return say("Esta categoria tem subcategorias e não pode virar subcategoria.");}
    if(c.is_active&&catDup(name,c.kind,par,c.id))return say("Já existe uma categoria com esse nome nesse lugar.");
    $("cs").disabled=true;
    const {error}=await sb.from("categories").update({name,parent_id:par}).eq("id",c.id);
    if(error){$("cs").disabled=false;return say("Erro: "+error.message);}
    S.cmsg="Categoria atualizada ✓";go("cat");};
  $("cr").onclick=async()=>{
    if(!c.is_active){
      const p=c.parent_id&&catById(c.parent_id);
      if(p&&!p.is_active)return say(`Reative primeiro a categoria-mãe "${p.name}".`);
      if(catDup(c.name,c.kind,c.parent_id,c.id))return say("Já existe uma categoria ativa com esse nome nesse lugar.");
      const {error}=await sb.from("categories").update({is_active:true}).eq("id",c.id);
      if(error)return say("Erro: "+error.message);
      S.cmsg=`"${c.name}" reativada ✓`;return go("cat");}
    const idsA=[c.id,...ativas.map(x=>x.id)];
    const nb=await sb.from("budgets").select("id",{count:"exact",head:true}).in("category_id",idsA);
    const txt=`Arquivar "${c.name}"${ativas.length?` e suas ${ativas.length} subcategoria(s)`:""}? Some do Lançar e das metas novas; os lançamentos antigos mantêm o nome.`+(nb.count?` Existem ${nb.count} meta(s) ligada(s): elas continuam existindo (apague em Metas se quiser).`:"");
    if(!confirm(txt))return;
    const {error}=await sb.from("categories").update({is_active:false}).in("id",idsA);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" arquivada ✓`;go("cat");};
  $("cdel").onclick=async()=>{
    if(filhas.length)return say(`Tem ${filhas.length} subcategoria(s) (inclusive arquivadas). Apague-as antes, ou arquive esta categoria.`);
    const [t,b,q]=await Promise.all([cnt("transactions","category_id"),cnt("budgets","category_id"),cnt("quick_entries","category_id")]);
    if(t==null||b==null||q==null)return say("Não consegui verificar o uso da categoria. Tente de novo.");
    if(t)return say(`Tem ${t} lançamento(s). Arquive em vez de apagar.`);
    if(b)return say(`Tem ${b} meta(s) ligada(s). Apague as metas ou arquive a categoria.`);
    if(q)return say(`É usada em ${q} atalho(s). Arquive em vez de apagar.`);
    if(!confirm(`Apagar "${c.name}" de vez? Isso não pode ser desfeito.`))return;
    const {error}=await sb.from("categories").delete().eq("id",c.id);
    if(error)return say("Erro: "+error.message);
    S.cmsg=`"${c.name}" apagada ✓`;S.ce=null;go("cat");};
}

/* ================= FATURA DO CARTÃO ================= */
async function viewFat(){
  const cards=S.accounts.filter(a=>a.type==="credit_card");
  if(!cards.length){$("main").innerHTML='<div class="card"><button class="lk" id="bk">← Voltar</button> Nenhum cartão cadastrado. Crie uma conta do tipo Cartão de crédito em Contas.</div>';$("bk").onclick=()=>go("acc");return;}
  if(!cards.some(a=>a.id===S.fatAcc))S.fatAcc=cards[0].id;
  const acc=cards.find(a=>a.id===S.fatAcc),cc=S.cards.find(c=>c.account_id===acc.id),cur=acc.currency.trim();
  if(!S.fatMon)S.fatMon=cc?stm(cc,today()):today().slice(0,8)+"01";
  const m=S.fatMon;
  const {data,error}=await sb.from("transactions").select("id,card_holder_id,date,amount,description,status,installment_number,installment_total,transfer_group_id,categories(name)").eq("account_id",acc.id).eq("statement_month",m).order("date");
  if(S.tab!=="fat"||S.fatAcc!==acc.id||S.fatMon!==m)return;
  if(error){$("main").innerHTML=`<div class="card neg">${esc(error.message)}</div>`;return;}
  const buy=data.filter(t=>!t.transfer_group_id),pay=data.filter(t=>t.transfer_group_id);
  const total=-buy.reduce((r,t)=>r+Number(t.amount),0),paid=pay.reduce((r,t)=>r+Number(t.amount),0),rest=Math.round((total-paid)*100)/100;
  const pa=S.accounts.filter(a=>a.type!=="credit_card");
  const H=holdersOf(acc.id),totH=id=>-buy.filter(t=>t.card_holder_id===id).reduce((r,t)=>r+Number(t.amount),0),sh=H.some(h=>h.id===S.fatH)?S.fatH:null,vis=sh?buy.filter(t=>t.card_holder_id===sh):buy;
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Fatura do cartão</b>
   <label>Cartão<select id="fc">${cards.map(a=>`<option value="${a.id}" ${a.id===acc.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <div class="row" style="align-items:center"><button class="x" id="fp">‹</button><b>${mlab(m)}</b><button class="x" id="fn">›</button></div>
   ${cc?`<div class="mu">Fecha dia ${cc.closing_day} · vence dia ${cc.due_day}</div>`:'<p class="neg">Cartão sem configuração: informe os dias em "Configurar cartão".</p>'}
   <div class="row"><span>Total da fatura</span><b>${fmt(total,cur)}</b></div>
   <div class="row"><span>Já pago</span><span class="pos">${fmt(paid,cur)}</span></div>
   <div class="row"><span>Falta pagar</span><b class="${rest>0?"neg":"pos"}">${fmt(rest,cur)}</b></div>
   ${H.length>1?`<div class="chips"><button data-fh="" class="${sh?"":"on"}">Todos</button>${H.map(h=>`<button data-fh="${h.id}" class="${sh===h.id?"on":""}">${esc(h.name)} ${fmt(totH(h.id),cur)}</button>`).join("")}</div>`:""}
   ${rest>0?'<button class="pri" id="fpay">Pagar fatura</button>':""}
   <button class="sec" id="fcc">🔒 Fechar esta fatura</button></div>
  <div class="card"><b>Lançamentos da fatura</b>${vis.length?vis.map(t=>`<div class="row"><div><div>${esc(t.description||t.categories?.name||"Sem descrição")}${t.installment_total?` <span class="mu">${t.installment_number}/${t.installment_total}</span>`:""}</div><div class="mu">${fdt(t.date)}${H.length>1&&t.card_holder_id?" · "+esc(holderName(t.card_holder_id)):""}${t.status==="planned"&&t.date>today()?" · previsto":""}</div></div>
    <div style="text-align:right;white-space:nowrap"><span class="${t.amount<0?"neg":"pos"}">${fmt(t.amount,cur)}</span><button class="x" data-mv="${t.id}|-1">‹</button><button class="x" data-mv="${t.id}|1">›</button></div></div>`).join(""):'<p class="mu">Nenhum lançamento nesta fatura.</p>'}
   <p class="mu">As setas ‹ › movem a compra para a fatura anterior ou a seguinte (ex.: compra no dia do fechamento).</p></div>
  <div class="card"><details ${cc?"":"open"}><summary>⚙ Configurar cartão</summary>
   <label>Dia de fechamento<input id="fcl" type="number" min="1" max="31" value="${cc?cc.closing_day:""}"></label>
   <label>Dia de vencimento<input id="fdu" type="number" min="1" max="31" value="${cc?cc.due_day:""}"></label>
   <label>Conta sugerida para pagar<select id="fpa"><option value="">(nenhuma)</option>${pa.map(a=>`<option value="${a.id}" ${cc&&a.id===cc.payment_account_id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <button class="pri" id="fsv">Salvar</button><p id="fm" class="neg"></p>
   <p class="mu">Vale para lançamentos novos ou editados; faturas já atribuídas não mudam.</p>
   <b style="display:block;margin-top:14px">Portadores</b>${H.map(h=>`<div class="row"><input data-hn="${h.id}" value="${esc(h.name)}"><button class="x" data-hx="${h.id}">✕</button></div>`).join("")}
   <label>Novo portador<input id="hnw" placeholder="Ex.: Esposa"></label><button class="sec" id="hadd">Adicionar portador</button><p id="hm" class="neg"></p></details></div>`;
  $("bk").onclick=()=>go("acc");
  $("fc").onchange=()=>{S.fatAcc=$("fc").value;S.fatMon=null;S.fatH=null;viewFat();};
  $("fp").onclick=()=>{S.fatMon=mAdd(m,-1);viewFat();};$("fn").onclick=()=>{S.fatMon=mAdd(m,1);viewFat();};
  $("fcc").onclick=()=>{S.cloAcc=acc.id;S.cloMon=m;go("clo");};
  if($("fpay"))$("fpay").onclick=()=>{S.trFrom="fat";S.tr={pay:true,to:acc.id,from:cc&&cc.payment_account_id||undefined,amt:rest,desc:"Pagamento da fatura "+mlab(m)+" · "+acc.name,stm:m};go("tr");};
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=async()=>{const [id,d]=b.dataset.mv.split("|");
    const {error}=await sb.from("transactions").update({statement_month:mAdd(m,+d)}).eq("id",id);
    if(error)return alert("Erro: "+error.message);viewFat();});
  document.querySelectorAll("[data-fh]").forEach(b=>b.onclick=()=>{S.fatH=b.dataset.fh||null;viewFat();});
  document.querySelectorAll("[data-hn]").forEach(el=>el.onchange=async()=>{const n=el.value.trim();if(!n)return;const {error}=await sb.from("card_holders").update({name:n}).eq("id",el.dataset.hn);$("hm").textContent=error?"Erro: "+error.message:"Nome salvo ✓";await loadCards();});
  document.querySelectorAll("[data-hx]").forEach(b=>b.onclick=async()=>{if(!confirm("Remover este portador?"))return;const {error}=await sb.from("card_holders").delete().eq("id",b.dataset.hx);if(error)return $("hm").textContent="Não foi possível remover (tem lançamentos?): "+error.message;await loadCards();viewFat();});
  $("hadd").onclick=async()=>{const n=$("hnw").value.trim();if(!n)return $("hm").textContent="Informe o nome.";const {error}=await sb.from("card_holders").insert({household_id:S.hid,account_id:acc.id,name:n});if(error)return $("hm").textContent="Erro: "+error.message;await loadCards();viewFat();};
  $("fsv").onclick=async()=>{const cl=+$("fcl").value,du=+$("fdu").value;
    if(!(cl>=1&&cl<=31&&du>=1&&du<=31))return $("fm").textContent="Informe dias entre 1 e 31.";
    const {error}=await sb.from("credit_cards").upsert({household_id:S.hid,account_id:acc.id,closing_day:cl,due_day:du,payment_account_id:$("fpa").value||null},{onConflict:"account_id"});
    if(error)return $("fm").textContent="Erro: "+error.message;
    await loadCards();viewFat();};
}

/* ================= FECHAMENTO MENSAL ================= */
async function viewClo(msg){
  if(!S.accounts.length){$("main").innerHTML='<div class="card"><button class="lk" id="bk">← Voltar</button> Cadastre uma conta primeiro.</div>';$("bk").onclick=()=>go("acc");return;}
  if(!S.accounts.some(a=>a.id===S.cloAcc))S.cloAcc=S.accounts[0].id;
  const acc=S.accounts.find(a=>a.id===S.cloAcc),cur=acc.currency.trim(),card=acc.type==="credit_card";
  const {data:cl,error}=await sb.from("balance_closings").select("id,ref_month,reported_balance,calculated_balance").eq("account_id",acc.id).order("ref_month",{ascending:false});
  if(error){$("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button><p class="neg">${esc(error.message)}</p><p class="mu">Se a tabela não existe, rode o script cartoes_fechamento.sql no Supabase.</p></div>`;$("bk").onclick=()=>go("acc");return;}
  if(!S.cloMon)S.cloMon=cl.length?mAdd(cl[0].ref_month,1):mAdd(today().slice(0,8)+"01",-1);
  const m=S.cloMon,done=cl.find(c=>c.ref_month===m);
  const {data:calc}=await sb.rpc("closing_balance",{p_account:acc.id,p_ref:m});
  const wl=acc.type==="benefit"&&!done?((await sb.rpc("wallet_closing_balances",{p_account:acc.id,p_ref:m})).data||[]).filter(w=>w.is_active||Number(w.balance)!==0):[];
  if(S.tab!=="clo"||S.cloAcc!==acc.id||S.cloMon!==m)return;
  const cv=Number(calc||0),dif=x=>{const d=Math.round(x*100)/100;return d===0?"confere ✓":"diferença "+fmt(d,cur);};
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Fechamento mensal</b>
   <label>${card?"Cartão":"Conta"}<select id="ca">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===acc.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
   <div class="row" style="align-items:center"><button class="x" id="cp">‹</button><b>${mlab(m)}</b><button class="x" id="cn">›</button></div>
   ${done?`<p class="pos">Fechado ✓</p><div class="row"><span>${card?"Total da fatura":"Saldo"} (app)</span><span>${fmt(done.calculated_balance,cur)}</span></div><div class="row"><span>Informado (extrato)</span><span>${fmt(done.reported_balance,cur)}</span></div><div class="mu">${dif(done.reported_balance-done.calculated_balance)}</div>`
   :`<div class="row"><span>${card?"Total da fatura no app":"Saldo no app, no fim do mês"}</span><b>${fmt(cv,cur)}</b></div>
   ${wl.length?wl.map(w=>`<label>${esc(w.name)} <span class="mu">(app ${fmt(w.balance,cur)})</span><input class="cw" data-w="${w.wallet_id}" data-a="${w.balance}" inputmode="decimal" placeholder="0,00"><span class="mu" id="cwd${w.wallet_id}"></span></label>`).join("")+`<label>Total no extrato (soma das carteiras)<input id="cv" readonly></label>`:`<label>${card?"Total da fatura no banco":"Saldo no extrato do banco"}<input id="cv" inputmode="decimal" placeholder="0,00"></label>`}
   <p id="cd" class="mu"></p><button class="pri" id="cs">Fechar ${esc(mlab(m))}</button>
   <p class="mu">Fechar congela os lançamentos até este mês${card?" (por fatura)":""}. Para corrigir depois, reabra o último fechamento.</p>`}
   <p id="cm" class="${msg?"pos":"neg"}">${esc(msg||"")}</p></div>
  <div class="card"><b>Fechamentos</b>${cl.length?cl.map((c,i)=>`<div class="row"><div>${mlab(c.ref_month)}<div class="mu">${fmt(c.reported_balance,cur)} · ${dif(c.reported_balance-c.calculated_balance)}</div></div>${i===0?`<button class="x" data-ro="${c.id}">Reabrir</button>`:""}</div>`).join(""):'<p class="mu">Nenhum fechamento nesta conta.</p>'}</div>`;
  const say=t=>{$("cm").className="neg";$("cm").textContent=t;};
  $("bk").onclick=()=>go("acc");
  $("ca").onchange=()=>{S.cloAcc=$("ca").value;S.cloMon=null;viewClo();};
  $("cp").onclick=()=>{S.cloMon=mAdd(m,-1);viewClo();};$("cn").onclick=()=>{S.cloMon=mAdd(m,1);viewClo();};
  if($("cv"))$("cv").oninput=()=>{const v=num($("cv").value);$("cd").textContent=isNaN(v)?"":"Comparação: "+dif(v-cv);};
  document.querySelectorAll(".cw").forEach(i=>i.oninput=()=>{
    const all=[...document.querySelectorAll(".cw")];
    all.forEach(x=>{const e=document.getElementById("cwd"+x.dataset.w),v=num(x.value);e.textContent=x.value.trim()&&!isNaN(v)?" "+dif(v-Number(x.dataset.a)):"";});
    const t=all.reduce((r,x)=>r+(num(x.value)||0),0);$("cv").value=String(Math.round(t*100)/100).replace(".",",");$("cv").oninput();});
  if($("cs"))$("cs").onclick=async()=>{
    if([...document.querySelectorAll(".cw")].some(x=>!x.value.trim()))return say("Informe o saldo de todas as carteiras (0 se estiver vazia).");
    const v=num($("cv").value);
    if(isNaN(v))return say("Informe o valor do extrato.");
    const d=Math.round((v-cv)*100)/100;
    if(d!==0&&!confirm(`Há diferença de ${fmt(d,cur)} entre o app e o banco. Fechar mesmo assim?`))return;
    $("cs").disabled=true;
    const {error}=await sb.rpc("close_balance",{p_account:acc.id,p_ref:m,p_reported:v});
    if(error){$("cs").disabled=false;return say(error.message);}
    viewClo("Mês fechado ✓");};
  document.querySelectorAll("[data-ro]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Reabrir o último fechamento? Os lançamentos desse mês voltam a poder ser alterados."))return;
    const {error}=await sb.from("balance_closings").delete().eq("id",b.dataset.ro);
    if(error)return say(error.message);
    viewClo("Fechamento reaberto ✓");});
}

/* ================= GERENCIAR CONTA ================= */
async function viewAcm(){
  const a=S.accounts.find(x=>x.id===S.acmId);if(!a){S.acmId=null;return go("acc");}
  const {data:bl}=await sb.from("account_balances").select("balance").eq("account_id",a.id).maybeSingle();
  if(S.tab!=="acm")return;
  const bal=Number((bl||{}).balance||0),cur=a.currency.trim();
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Gerenciar conta</b> <span class="mu">${TYPES[a.type]} · ${esc(cur)}</span>
   <label>Nome<input id="an2" value="${esc(a.name)}"></label>
   <button class="pri" id="as">Salvar nome</button>
   <div class="row" style="margin-top:14px"><span>Saldo atual</span><b>${fmt(bal,cur)}</b></div>
   ${(a.type==="checking"||a.type==="cash")&&cur==="BRL"?`<div class="card" style="margin-top:12px"><b>Saldo inicial</b>
     <label>Saldo no extrato<input id="aob" inputmode="decimal" placeholder="0,00" value="${a.opening_balance==null?"":fa(a.opening_balance)}"></label>
     <label>Na data (último dia de um mês)<input type="date" id="aod" value="${a.opening_date||""}"></label>
     <button class="sec" id="aos">Salvar saldo inicial</button>${a.opening_date?'<button class="x" id="aoc" style="margin-top:8px">Remover saldo inicial</button>':""}
     <p class="mu">Informe o saldo do extrato no último dia de um mês (ex.: 31/12/2025). Os lançamentos até essa data continuam visíveis e contam no Resultado, mas não somam no saldo. Use a mesma data em todas as contas. Para mudar a data de uma conta com fechamentos, reabra antes os fechamentos posteriores.</p></div>`:""}
   ${a.type==="credit_card"?`<div class="card" style="margin-top:12px"><b>Mês de partida da dívida</b>
     <label>A partir de<input type="month" id="asm" value="${a.start_month?a.start_month.slice(0,7):""}"></label>
     <button class="sec" id="asv">Salvar partida</button>
     <p class="mu">Só entram no saldo e na dívida do Painel as faturas deste mês em diante (compras e pagamentos). As anteriores continuam visíveis em Lançamentos e na Fatura. Deixe vazio para somar tudo.</p></div>`:""}
   <button class="sec neg" id="ai">Inativar conta</button><p id="am" class="neg"></p>
   <p class="mu">Inativar esconde a conta das telas e do saldo geral; os lançamentos ficam guardados e você pode reativar em Contas. Só é possível com saldo zerado${a.type==="credit_card"?" (cartão sem dívida)":""}.</p></div>`;
  if(a.type==="benefit"){await loadWallets();if(S.tab!=="acm")return;drawWal(a);}
  const say=t=>{$("am").textContent=t;};
  $("bk").onclick=()=>go("acc");
  $("as").onclick=async()=>{const n=$("an2").value.trim();
    if(!n)return say("Informe o nome da conta.");
    if(S.accounts.some(x=>x.id!==a.id&&x.name.trim().toLowerCase()===n.toLowerCase()))return say("Já existe uma conta com esse nome.");
    const {error}=await sb.from("accounts").update({name:n}).eq("id",a.id);
    if(error)return say("Erro: "+error.message);
    await loadRef();go("acc");};
  if($("aos"))$("aos").onclick=async()=>{const v=num($("aob").value),d=$("aod").value;
    if(isNaN(v))return say("Informe o saldo do extrato.");
    if(!d)return say("Informe a data do saldo.");
    const nx=new Date(d+"T12:00:00");nx.setDate(nx.getDate()+1);
    if(nx.getDate()!==1)return say("Use o último dia de um mês (ex.: 31/08/2026).");
    const {error}=await sb.from("accounts").update({opening_balance:v,opening_date:d}).eq("id",a.id);
    if(error)return say("Erro: "+error.message);await loadRef();viewAcm();};
  if($("aoc"))$("aoc").onclick=async()=>{if(!confirm("Remover o saldo inicial desta conta?"))return;
    const {error}=await sb.from("accounts").update({opening_balance:null,opening_date:null}).eq("id",a.id);
    if(error)return say("Erro: "+error.message);await loadRef();viewAcm();};
  if($("asv"))$("asv").onclick=async()=>{const v=$("asm").value,{error}=await sb.from("accounts").update({start_month:v?v+"-01":null}).eq("id",a.id);
    if(error)return say("Erro: "+error.message);await loadRef();viewAcm();};
  $("ai").onclick=async()=>{
    if(Math.abs(bal)>=0.005)return say(`O saldo é ${fmt(bal,cur)}. Zere antes de inativar (transferência ou ajuste).`);
    if(!confirm(`Inativar a conta "${a.name}"?`))return;
    const {error}=await sb.from("accounts").update({is_active:false}).eq("id",a.id);
    if(error)return say("Erro: "+error.message);
    S.acmId=null;await loadRef();go("acc");};
}

function drawWal(a,m){
  const cur=a.currency.trim(),act=S.wallets.filter(w=>w.account_id===a.id&&w.is_active),ina=S.wallets.filter(w=>w.account_id===a.id&&!w.is_active);
  const mo=sel=>'<option value="">Todo mês</option>'+MESES.map((x,i)=>`<option value="${i+1}" ${+sel===i+1?"selected":""}>${x[0].toUpperCase()+x.slice(1)}</option>`).join("");
  $("main").insertAdjacentHTML("beforeend",`<div class="card" id="wcard"><b>Carteiras</b><div class="mu">O saldo da conta é a soma das carteiras.</div>
   ${act.map(w=>`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="row" style="border:0;padding:0"><input data-wn="${w.id}" value="${esc(w.name)}"><b style="white-space:nowrap;margin-left:8px;align-self:center">${fmt(S.wbal[w.id]||0,cur)}</b></div>
     <div style="display:flex;gap:8px"><label style="flex:1">Valor esperado<input data-we="${w.id}" inputmode="decimal" placeholder="0,00" value="${fa(w.expected_amount)}"></label><label style="flex:1">Cai em<select data-wm="${w.id}">${mo(w.credit_month)}</select></label></div>
     <button class="x" data-wi="${w.id}" style="margin:8px 0 0">Inativar</button></div>`).join("")||'<p class="mu">Nenhuma carteira ainda.</p>'}
   <b style="display:block;margin-top:14px">Nova carteira</b>
   <label>Nome<input id="wnn" placeholder="Ex.: Refeição e Alimentação"></label>
   <div style="display:flex;gap:8px"><label style="flex:1">Valor esperado<input id="wne" inputmode="decimal" placeholder="0,00"></label><label style="flex:1">Cai em<select id="wnm">${mo("")}</select></label></div>
   <button class="sec" id="wadd">Adicionar carteira</button><p id="wmsg" class="${m?"pos":"neg"}">${esc(m||"")}</p>
   ${ina.length?`<details><summary>Carteiras inativas (${ina.length})</summary>${ina.map(w=>`<div class="row"><span>${esc(w.name)}</span><button class="x" data-wr="${w.id}">Reativar</button></div>`).join("")}</details>`:""}</div>`);
  const say=t=>{$("wmsg").className="neg";$("wmsg").textContent=t;};
  const redo=async t=>{await loadWallets();$("wcard").remove();drawWal(a,t);};
  const err=e=>e.message.includes("wallets_acc_name_uq")?"Já existe uma carteira ativa com esse nome.":"Erro: "+e.message;
  const dup=(n,except)=>S.wallets.some(w=>w.account_id===a.id&&w.is_active&&w.id!==except&&w.name.trim().toLowerCase()===n.toLowerCase());
  const upd=async(id,patch,t)=>{const {error}=await sb.from("wallets").update(patch).eq("id",id);if(error)return say(err(error));await redo(t);};
  document.querySelectorAll("[data-wn]").forEach(el=>el.onchange=()=>{const n=el.value.trim();
    if(!n)return say("Informe o nome da carteira.");if(dup(n,el.dataset.wn))return say("Já existe uma carteira ativa com esse nome.");upd(el.dataset.wn,{name:n},"Nome salvo ✓");});
  document.querySelectorAll("[data-we]").forEach(el=>el.onchange=()=>{const s=el.value.trim(),v=s?num(s):null;
    if(s&&!(v>0))return say("Valor esperado inválido.");upd(el.dataset.we,{expected_amount:v},"Valor salvo ✓");});
  document.querySelectorAll("[data-wm]").forEach(el=>el.onchange=()=>upd(el.dataset.wm,{credit_month:el.value?+el.value:null},"Mês salvo ✓"));
  document.querySelectorAll("[data-wi]").forEach(b=>b.onclick=()=>{const id=b.dataset.wi,bal=S.wbal[id]||0;
    if(Math.abs(bal)>=0.005)return say(`O saldo é ${fmt(bal,cur)}. Só é possível inativar carteira com saldo zero.`);
    if(!confirm("Inativar esta carteira?"))return;upd(id,{is_active:false},"Carteira inativada ✓");});
  document.querySelectorAll("[data-wr]").forEach(b=>b.onclick=()=>{if(dup(S.wallets.find(w=>w.id===b.dataset.wr).name,b.dataset.wr))return say("Já existe uma carteira ativa com esse nome.");upd(b.dataset.wr,{is_active:true},"Carteira reativada ✓");});
  $("wadd").onclick=async()=>{const n=$("wnn").value.trim(),s=$("wne").value.trim(),v=s?num(s):null;
    if(!n)return say("Informe o nome da carteira.");if(dup(n))return say("Já existe uma carteira ativa com esse nome.");
    if(s&&!(v>0))return say("Valor esperado inválido.");
    const {error}=await sb.from("wallets").insert({household_id:S.hid,account_id:a.id,name:n,expected_amount:v,credit_month:$("wnm").value?+$("wnm").value:null});
    if(error)return say(err(error));await redo("Carteira criada ✓");};
}

/* ================= VERSÍCULOS ================= */
const refv=v=>`${v.book} ${v.chapter}:${v.verse_start}${v.verse_end?"-"+v.verse_end:""}`;
// scope: "own" = só a família atual | "all" = todas as famílias das quais a pessoa faz parte
const famName=id=>(S.hs.find(h=>h.id===id)||{}).name||"Família";
function verQuery(scope,onlyActive){
  let q=sb.from("bible_verses").select("*");
  q=scope==="all"?q.in("household_id",S.hs.map(h=>h.id)):q.eq("household_id",S.hid);
  if(onlyActive)q=q.eq("is_active",true);
  return q.order("created_at").order("id");
}
async function splash(){
  const s=await sb.from("verse_settings").select("*").eq("household_id",S.hid).eq("user_id",S.uid).maybeSingle();
  const st=s.data;
  if(st&&st.splash===false)return;
  const scope=st&&st.verse_scope==="all"?"all":"own";
  const v=await verQuery(scope,true);
  const L=v.data||[];
  if(v.error||!L.length)return;
  const mode=st?st.verse_order:"random",last=st?st.last_id:null;let x;
  if(mode==="sequential"){const i=L.findIndex(a=>a.id===last);x=L[(i+1)%L.length];}
  else{const c=L.length>1?L.filter(a=>a.id!==last):L;x=c[Math.floor(Math.random()*c.length)];}
  sb.from("verse_settings").upsert({household_id:S.hid,user_id:S.uid,verse_order:mode,splash:st?st.splash:true,verse_scope:scope,last_id:x.id},{onConflict:"household_id,user_id"}).then(()=>{});
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;z-index:99;background:var(--bg);color:var(--tx);display:flex;justify-content:center;align-items:center;padding:calc(32px + env(safe-area-inset-top)) 28px 32px;text-align:center;cursor:pointer";
  d.innerHTML=`<div style="max-width:520px"><div style="font-size:1.3rem;line-height:1.6;font-style:italic">“${esc(x.text)}”</div><div style="margin-top:20px;font-weight:700;color:var(--ac)">${esc(refv(x))}</div>${x.version?`<div class="mu" style="font-size:.8rem;margin-top:2px">${esc(x.version)}</div>`:""}<div class="mu" style="margin-top:40px">Toque para continuar</div></div>`;
  document.body.appendChild(d);
  return new Promise(res=>{d.onclick=()=>{d.remove();res();};});
}
async function viewVer(msg){
  const s=await sb.from("verse_settings").select("*").eq("household_id",S.hid).eq("user_id",S.uid).maybeSingle();
  const scope=s.data&&s.data.verse_scope==="all"?"all":"own";
  const v=await verQuery(scope,false);
  if(v.data)v.data.sort((a,b)=>a.book.localeCompare(b.book,"pt")||a.chapter-b.chapter||a.verse_start-b.verse_start);
  if(S.tab!=="ver")return;
  if(v.error){$("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button><p class="neg">${esc(v.error.message)}</p><p class="mu">Se a tabela não existe, rode o script versiculos.sql no Supabase.</p></div>`;$("bk").onclick=()=>go("acc");return;}
  const L=v.data||[],st=s.data||{verse_order:"random",splash:true},multi=S.hs.length>1,E=L.find(x=>x.id===S.vid)||{};
  const VERS=[...new Set(L.map(x=>(x.version||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Versículos</b>
   <label>Ordem de exibição<select id="vo"><option value="random" ${st.verse_order==="random"?"selected":""}>Aleatória</option><option value="sequential" ${st.verse_order==="sequential"?"selected":""}>Sequencial</option></select></label>
   ${multi?`<label>Versículos exibidos<select id="vsc"><option value="own" ${scope==="own"?"selected":""}>Apenas da família atual (${esc(famName(S.hid))})</option><option value="all" ${scope==="all"?"selected":""}>De todas as minhas famílias</option></select></label>`:""}
   <label class="ck"><input type="checkbox" id="vs" ${st.splash!==false?"checked":""}> Mostrar versículo ao abrir o app</label>
   <button class="sec" id="vsv">Salvar configuração</button></div>
  <div class="card"><b>${E.id?"Editar versículo":"Novo versículo"}</b>
   <label>Livro<input id="vb" value="${esc(E.book||"")}" placeholder="Ex.: Mateus"></label>
   <div style="display:flex;gap:8px"><label style="flex:1">Capítulo<input id="vc" type="number" min="1" value="${E.chapter||""}"></label><label style="flex:1">Versículo<input id="vv" type="number" min="1" value="${E.verse_start||""}"></label><label style="flex:1">Até (opc.)<input id="ve" type="number" min="1" value="${E.verse_end||""}"></label></div>
   <label>Versão da Bíblia<input id="vver" list="vvers" autocomplete="off" value="${esc(E.id?(E.version||""):(lsGet("ver_last")||""))}" placeholder="Ex.: Nova Versão Internacional"></label>
   <datalist id="vvers">${VERS.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
   <label>Texto<textarea id="vtx" rows="5">${esc(E.text||"")}</textarea></label>
   <button class="pri" id="vsave">${E.id?"Salvar alterações":"Adicionar"}</button>${E.id?'<button class="sec" id="vcan">Cancelar edição</button>':""}
   <p id="vm" class="${msg?"pos":"neg"}">${esc(msg||"")}</p></div>
  <div class="card"><b>Cadastrados (${L.length})</b>${L.map(x=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(refv(x))}${x.is_active?"":" (inativo)"}${scope==="all"&&multi?` <span class="mu">· ${esc(famName(x.household_id))}</span>`:""}</b><span style="white-space:nowrap"><button class="x" data-ve="${x.id}">✏️</button><button class="x" data-vt="${x.id}">${x.is_active?"Desativar":"Ativar"}</button><button class="x" data-vd="${x.id}">✕</button></span></div>${x.version?`<div class="mu" style="font-size:.8rem">${esc(x.version)}</div>`:""}<div class="mu">${esc(x.text)}</div></div>`).join("")||'<p class="mu">Nenhum versículo ainda.</p>'}</div>`;
  const say=t=>{$("vm").className="neg";$("vm").textContent=t;};
  $("bk").onclick=()=>{S.vid=null;go("acc");};
  $("vsv").onclick=async()=>{const {error}=await sb.from("verse_settings").upsert({household_id:S.hid,user_id:S.uid,verse_order:$("vo").value,splash:$("vs").checked,verse_scope:$("vsc")?$("vsc").value:scope,last_id:st.last_id||null},{onConflict:"household_id,user_id"});
    if(error)return say("Erro: "+error.message);viewVer("Configuração salva ✓");};
  $("vsave").onclick=async()=>{
    const b=$("vb").value.trim(),c=+$("vc").value,vs=+$("vv").value,ve=$("ve").value?+$("ve").value:null,t=$("vtx").value.trim();
    if(!b||!(c>=1)||!(vs>=1)||!t)return say("Preencha livro, capítulo, versículo e texto.");
    if(ve!==null&&ve<=vs)return say("O versículo final deve ser maior que o inicial (ou deixe em branco).");
    const vr=$("vver").value.trim()||null;
    const row={household_id:E.id?E.household_id:S.hid,book:b,chapter:c,verse_start:vs,verse_end:ve,text:t,version:vr};
    const {error}=E.id?await sb.from("bible_verses").update(row).eq("id",E.id):await sb.from("bible_verses").insert(row);
    if(error)return say("Erro: "+error.message);if(vr)lsSet("ver_last",vr);S.vid=null;viewVer("Salvo ✓");};
  if($("vcan"))$("vcan").onclick=()=>{S.vid=null;viewVer();};
  document.querySelectorAll("[data-ve]").forEach(b=>b.onclick=()=>{S.vid=b.dataset.ve;viewVer().then(()=>window.scrollTo(0,0));});
  document.querySelectorAll("[data-vt]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id===b.dataset.vt);
    const {error}=await sb.from("bible_verses").update({is_active:!x.is_active}).eq("id",x.id);if(error)return say("Erro: "+error.message);viewVer();});
  document.querySelectorAll("[data-vd]").forEach(b=>b.onclick=async()=>{if(!confirm("Apagar este versículo?"))return;
    const {error}=await sb.from("bible_verses").delete().eq("id",b.dataset.vd);if(error)return say("Erro: "+error.message);viewVer();});
}

sb.auth.getSession().then(({data:{session}})=>session?start():show("login"));

/* ===== Investimentos (Fase 1) ===== */
const ICLS={renda_fixa:"Renda fixa",acoes:"Ações",fiis:"FIIs",cripto:"Cripto",previdencia:"Previdência",outros:"Outros"},r2=v=>Math.round(v*100)/100,nq=v=>Number(v).toLocaleString("pt-BR",{maximumFractionDigits:8});
async function viewInv(){
  const hid=S.hid,y0=today().slice(0,4)+"-01-01",[sm,po,op,ri,ry]=await Promise.all([
    sb.from("investment_account_summary").select("*").eq("household_id",hid),
    sb.from("investment_positions").select("*").eq("household_id",hid).order("name"),
    sb.from("investment_operations").select("id,date,side,quantity,amount,fees,realized_result,investment_assets(name,ticker)").eq("household_id",hid).order("date",{ascending:false}).order("created_at",{ascending:false}).limit(15),
    sb.from("investment_income").select("id,date,kind,tax_withheld,net,investment_assets(name,ticker)").eq("household_id",hid).order("date",{ascending:false}).order("created_at",{ascending:false}).limit(15),
    sb.from("investment_income").select("net").eq("household_id",hid).gte("date",y0)]);
  if(S.tab!=="inv")return;
  const er=[sm,po,op,ri,ry].find(r=>r.error);
  if(er){$("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button><p class="neg">${esc(er.error.message)}</p><p class="mu">Se a tabela ou a view não existe, rode o script investimentos_fase1.sql no Supabase.</p></div>`;$("bk").onclick=()=>go("acc");return;}
  const A=S.accounts.filter(a=>a.type==="investment"),ok=id=>A.some(a=>a.id===id),
    P=(po.data||[]).filter(p=>p.is_active&&ok(p.account_id)),H=P.filter(p=>Number(p.qty)>0),m=S.im||"",
    T=(sm.data||[]).filter(x=>ok(x.account_id)),cls={},sum=k=>T.reduce((r,x)=>r+Number(x[k]||0),0),td=new Date().toISOString().slice(0,10);
  H.forEach(p=>{cls[p.class]=(cls[p.class]||0)+Number(p.current_value);});
  const sel=(id,o)=>`<select id="${id}">${o}</select>`,accO=A.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join(""),
    clsO=Object.keys(ICLS).map(k=>`<option value="${k}">${ICLS[k]}</option>`).join("");
  let form="";
  if(m==="asset")form=`<div class="card"><b>Novo ativo</b>
    <label>Conta de investimento${sel("ia",accO)}</label>
    <label>Classe${sel("ic",clsO)}</label>
    <label>Como informar o valor${sel("ip",'<option value="quote">Quantidade × cotação (ações, FIIs, cripto)</option><option value="total">Valor total do título (Tesouro, renda fixa)</option>')}</label>
    <label>Ticker (código, ações e FIIs)<input id="it" placeholder="Ex.: ITSA4" autocapitalize="characters"></label>
    <label>Nome da empresa, fundo ou título<input id="in" placeholder="Ex.: Itaúsa PN"></label>
    <label>CNPJ (ações e FIIs, para o IR)<input id="icn" inputmode="numeric"></label>
    <label>Taxa (opcional)<input id="ir" placeholder="Ex.: IPCA + 6%"></label>
    <label>Vencimento (opcional)<input id="iv" type="date"></label>
    <button class="sec" id="isv">Salvar ativo</button><button class="lk" id="icx">Cancelar</button></div>`;
  if(m==="op")form=`<div class="card"><b>Nova operação</b>
    <label>Ativo${sel("oa",P.map(p=>`<option value="${p.asset_id}">${esc(p.ticker||p.name)} · ${esc(p.name)}</option>`).join(""))}</label>
    <label>Tipo${sel("os",'<option value="buy">Compra</option><option value="sell">Venda / resgate</option>')}</label>
    <label>Data<input id="od" type="date" value="${td}"></label>
    <label class="oq">Quantidade<input id="oqt" inputmode="decimal"></label>
    <label class="oq">Preço unitário (R$)<input id="opu" inputmode="decimal"></label>
    <label>Valor total (R$)<input id="ov" inputmode="decimal" placeholder="Em ações e FIIs, vazio = quantidade × preço"></label>
    <label>Corretagem e taxas (R$)<input id="of" inputmode="decimal" placeholder="0,00"></label>
    <p class="mu">Compra tira do caixa e sobe a posição; venda faz o contrário. Não é receita nem despesa. Em Tesouro e renda fixa, nesta fase só há resgate total (informe o valor recebido).</p>
    <button class="sec" id="osv">Salvar operação</button><button class="lk" id="ocx">Cancelar</button></div>`;
  if(m==="quo")form=`<div class="card"><b>Atualizar cotações</b>
    <label>Data<input id="qd" type="date" value="${td}"></label>
    ${H.map(p=>`<label>${esc(p.ticker||p.name)} · ${p.price_mode==="quote"?"cotação (R$ por unidade)":"valor total atualizado (R$)"}<input data-q="${p.asset_id}" inputmode="decimal" placeholder="${p.last_value!=null?nq(p.last_value):""}"></label>`).join("")||'<p class="mu">Nenhum ativo em carteira.</p>'}
    <button class="sec" id="qsv">Salvar</button><button class="lk" id="qcx">Cancelar</button></div>`;
  const KIND={juros:"Juros",dividendo:"Dividendo",jcp:"JCP",rendimento_fii:"Rendimento de FII",outros:"Outros"};
  if(m==="inc")form=`<div class="card"><b>Novo rendimento</b>
    <label>Ativo${sel("ra",P.map(p=>`<option value="${p.asset_id}">${esc(p.ticker||p.name)} (${esc(A.find(a=>a.id===p.account_id)?.name||"")})</option>`).join(""))}</label>
    <label>Tipo${sel("rk",Object.keys(KIND).map(k=>`<option value="${k}">${KIND[k]}</option>`).join(""))}</label>
    <label>Data de pagamento<input id="rd" type="date" value="${td}"></label>
    <label>Valor bruto (R$)<input id="rg" inputmode="decimal"></label>
    <label>IR retido (R$, opcional)<input id="rt" inputmode="decimal" placeholder="0,00"></label>
    <p class="mu" id="rn"></p>
    <p class="mu">Entra no caixa da conta de investimento pelo valor líquido. Não é receita nem entra no Resultado do período.</p>
    <button class="sec" id="rsv">Salvar rendimento</button><button class="lk" id="rcx">Cancelar</button></div>`;
  $("main").innerHTML=`<div class="card"><button class="lk" id="bk">← Voltar</button> <b>Investimentos</b>
    ${A.length?`<div class="row" style="margin-top:8px"><b>Patrimônio</b><b>${mm(sum("total"))}</b></div>
    <div class="row"><span class="mu">Caixa (ainda não investido)</span><span>${mm(sum("cash"))}</span></div>
    <div class="row"><span class="mu">Em ativos</span><span>${mm(sum("in_assets"))}</span></div>
    <div class="row"><span class="mu">Rendimentos no ano (líquido)</span><span class="pos">${mm((ry.data||[]).reduce((r,x)=>r+Number(x.net),0))}</span></div>
    ${Object.keys(cls).map(k=>`<div class="row" style="padding-left:14px"><span class="mu">${ICLS[k]}</span><span>${mm(cls[k])}</span></div>`).join("")}`
    :'<p class="mu">Crie em Contas uma conta do tipo Investimento (em reais) e transfira dinheiro para ela. Cada aporte é uma transferência.</p>'}</div>
  ${A.length&&!m?`<div class="card"><button class="sec" id="nb" style="margin-top:0">+ Ativo</button><button class="sec" id="no" ${P.length?"":"disabled"}>+ Operação (compra ou venda)</button><button class="sec" id="nq" ${H.length?"":"disabled"}>Atualizar cotações</button><button class="sec" id="nr" ${P.length?"":"disabled"}>+ Rendimento</button></div>`:""}
  ${form}
  ${H.length?`<div class="card"><b>Posições</b>${H.map(p=>{const q=p.price_mode==="quote",res=Number(p.current_value)-Number(p.cost);
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.ticker||p.name)}</b><b>${mm(p.current_value)}</b></div>
    <div class="mu">${esc(p.name)} · ${ICLS[p.class]} · ${q?`${nq(p.qty)} un. · preço médio ${mm(p.avg_price)}${p.last_value!=null?" · cotação "+mm(p.last_value)+" ("+fdt(p.last_date)+")":" · sem cotação (usa o preço médio)"}`:`custo ${mm(p.cost)}${p.last_value!=null?" · atualizado em "+fdt(p.last_date):" · sem valor informado (usa o custo)"}`}</div>
    <div class="${res<0?"neg":"pos"}" style="font-size:.85rem">Resultado ${mm(res)}</div></div>`;}).join("")}</div>`:""}
  ${(op.data||[]).length?`<div class="card"><b>Últimas operações</b>${op.data.map(o=>`<div class="row"><div><div>${o.side==="buy"?"Compra":"Venda"} · ${esc(o.investment_assets?.ticker||o.investment_assets?.name||"")}</div><div class="mu">${fdt(o.date)}${o.quantity?" · "+nq(o.quantity)+" un.":""}${Number(o.fees)?" · taxas "+mm(o.fees):""}${o.realized_result!=null?" · resultado "+mm(o.realized_result):""}</div></div><div style="white-space:nowrap"><span>${mm(o.amount)}</span><button class="x" data-od="${o.id}">✕</button></div></div>`).join("")}</div>`:""}`;
  if((ri.data||[]).length)$("main").insertAdjacentHTML("beforeend",`<div class="card"><b>Últimos rendimentos</b>${ri.data.map(i=>`<div class="row"><div><div>${KIND[i.kind]} · ${esc(i.investment_assets?.ticker||i.investment_assets?.name||"")}</div><div class="mu">${fdt(i.date)}${Number(i.tax_withheld)?" · IR retido "+mm(i.tax_withheld):""}</div></div><div style="white-space:nowrap"><span class="pos">${mm(i.net)}</span><button class="x" data-ri="${i.id}">✕</button></div></div>`).join("")}</div>`);
  const rl=()=>{S.im="";viewInv();};
  $("bk").onclick=()=>go("acc");
  if($("nb"))$("nb").onclick=()=>{S.im="asset";viewInv();};
  if($("no"))$("no").onclick=()=>{S.im="op";viewInv();};
  if($("nq"))$("nq").onclick=()=>{S.im="quo";viewInv();};
  if($("nr"))$("nr").onclick=()=>{S.im="inc";viewInv();};
  ["icx","ocx","qcx","rcx"].forEach(i=>{if($(i))$(i).onclick=rl;});
  if($("ic"))$("ic").onchange=()=>{$("ip").value=["acoes","fiis","cripto"].includes($("ic").value)?"quote":"total";};
  if($("ic"))$("ic").onchange();
  if($("isv"))$("isv").onclick=async()=>{const n=$("in").value.trim(),t=$("it").value.trim().toUpperCase();
    if(!n){alert("Informe o nome.");return;}
    const {error}=await sb.from("investment_assets").insert({household_id:hid,account_id:$("ia").value,class:$("ic").value,price_mode:$("ip").value,ticker:t||null,name:n,cnpj:$("icn").value.trim()||null,rate:$("ir").value.trim()||null,maturity:$("iv").value||null});
    if(error){alert("Erro: "+error.message);return;}rl();};
  const sync=()=>{const a=P.find(x=>x.asset_id===$("oa").value);document.querySelectorAll(".oq").forEach(e=>{e.style.display=a&&a.price_mode==="quote"?"":"none";});};
  if($("oa")){$("oa").onchange=sync;sync();}
  if($("osv"))$("osv").onclick=async()=>{const a=P.find(x=>x.asset_id===$("oa").value),q=a.price_mode==="quote",
      qt=q?num($("oqt").value||""):null,pu=q&&$("opu").value?num($("opu").value):null,fe=$("of").value?num($("of").value):0;
    let am=$("ov").value?num($("ov").value):(q&&qt&&pu?r2(qt*pu):NaN);
    if(!$("od").value||!(am>0)||(q&&!(qt>0))||!(fe>=0)){alert("Confira data, quantidade e valores.");return;}
    const {error}=await sb.from("investment_operations").insert({asset_id:a.asset_id,date:$("od").value,side:$("os").value,quantity:qt,unit_price:pu,amount:am,fees:fe});
    if(error){alert("Erro: "+error.message);return;}rl();};
  if($("qsv"))$("qsv").onclick=async()=>{const d=$("qd").value,rows=[...document.querySelectorAll("[data-q]")].filter(i=>i.value.trim()).map(i=>({asset_id:i.dataset.q,date:d,value:num(i.value)}));
    if(!d||!rows.length||rows.some(r=>!(r.value>=0))){alert("Informe a data e ao menos um valor válido.");return;}
    const {error}=await sb.from("investment_snapshots").upsert(rows,{onConflict:"asset_id,date"});
    if(error){alert("Erro: "+error.message);return;}rl();};
  const rnv=()=>{const g=num($("rg").value||""),t=$("rt").value?num($("rt").value):0;$("rn").textContent=g>0&&t>=0&&t<=g?"Líquido: "+mm(g-t):"";};
  if($("rg")){$("rg").oninput=rnv;$("rt").oninput=rnv;}
  if($("rsv"))$("rsv").onclick=async()=>{const g=num($("rg").value||""),t=$("rt").value?num($("rt").value):0;
    if(!$("rd").value||!(g>0)||!(t>=0)||t>g){alert("Confira a data, o valor bruto e o IR retido (não pode passar do bruto).");return;}
    const {error}=await sb.from("investment_income").insert({asset_id:$("ra").value,date:$("rd").value,kind:$("rk").value,gross:g,tax_withheld:t});
    if(error){alert("Erro: "+error.message);return;}rl();};
  document.querySelectorAll("[data-ri]").forEach(b=>b.onclick=async()=>{if(!confirm("Apagar este rendimento? O caixa da conta será recalculado."))return;
    const {error}=await sb.from("investment_income").delete().eq("id",b.dataset.ri);
    if(error)alert("Erro: "+error.message);viewInv();});
  document.querySelectorAll("[data-od]").forEach(b=>b.onclick=async()=>{if(!confirm("Apagar esta operação? O preço médio será recalculado."))return;
    const {error}=await sb.from("investment_operations").delete().eq("id",b.dataset.od);
    if(error)alert("Erro: "+error.message);viewInv();});
}
