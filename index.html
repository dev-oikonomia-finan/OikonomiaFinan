<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oikonomia - Controle Financeiro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

    <!-- TELA DE LOGIN COM O GOOGLE (Visível apenas quando deslogado) -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 space-y-6 text-center">
            <div>
                <h1 class="text-2xl font-bold text-indigo-900">💰 Oikonomia</h1>
                <p class="text-sm text-slate-500 mt-1">Controle financeiro pessoal e familiar</p>
            </div>

            <div class="py-4">
                <button id="btn-login-google" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm">
                    <!-- Ícone do Google -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Entrar com o Google
                </button>
            </div>

            <div id="auth-error" class="text-rose-600 text-sm hidden"></div>

            <p class="text-xs text-slate-400">
                Acesso restrito aos administradores autorizados.
            </p>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL (Oculta até o usuário logar) -->
    <div id="app-screen" class="hidden flex flex-col min-h-screen justify-between">
        <!-- Cabeçalho -->
        <header class="bg-indigo-600 shadow-md py-4 px-6 text-white flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-bold">💰 Oikonomia</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-email-display" class="text-xs bg-indigo-500 px-3 py-1 rounded-full hidden md:inline-block"></span>
                <button id="btn-logout" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-1.5 rounded-lg transition">Sair</button>
            </div>
        </header>

        <!-- Container Principal -->
        <main class="max-w-4xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">
            <!-- Coluna Esquerda: Formulário -->
            <section class="bg-white p-5 rounded-2xl shadow-sm md:col-span-1">
                <h2 class="text-lg font-semibold mb-4 text-indigo-900 border-b pb-2">Novo Lançamento</h2>

                <form id="transacao-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Tipo</label>
                        <select id="tipo" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="despesa">Despesa 📉</option>
                            <option value="receita">Receita 📈</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Descrição</label>
                        <input type="text" id="descricao" required placeholder="Ex: Supermercado..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Categoria</label>
                        <select id="categoria" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Alimentação">Alimentação</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Investimentos">Investimentos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Data</label>
                        <input type="date" id="data" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md">
                        Salvar Lançamento
                    </button>
                </form>
            </section>

            <!-- Coluna Direita: Histórico -->
            <section class="bg-white p-5 rounded-2xl shadow-sm md:col-span-2 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-4 text-indigo-900 border-b pb-2">Histórico de Lançamentos</h2>

                    <div class="overflow-x-auto max-h-[400px]">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b">
                                    <th class="p-3">Data</th>
                                    <th class="p-3">Descrição</th>
                                    <th class="p-3">Categoria</th>
                                    <th class="p-3 text-right">Valor</th>
                                </tr>
                            </thead>
                            <tbody id="lista-transacoes" class="divide-y divide-slate-100 text-sm">
                                <tr>
                                    <td colspan="4" class="p-4 text-center text-slate-400">Carregando dados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Rodapé com Resumo -->
                <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center bg-slate-50 p-4 rounded-xl">
                    <span class="text-sm font-medium text-slate-600">Total Registrado:</span>
                    <span id="total-geral" class="text-xl font-bold text-slate-800">R$ 0,00</span>
                </div>
            </section>
        </main>

        <footer class="text-center py-4 text-xs text-slate-400">
            Oikonomia - Controle Financeiro Seguro
        </footer>
    </div>

    <!-- Script Modular com Google Auth (Popup) -->
    <script type="module">
        import { firebaseConfig } from './oikonomia-fire-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Inicializa Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const btnLoginGoogle = document.getElementById('btn-login-google');
        const authError = document.getElementById('auth-error');
        const btnLogout = document.getElementById('btn-logout');
        const userEmailDisplay = document.getElementById('user-email-display');

        // Seus e-mails permitidos
        const EMAILS_PERMITIDOS = [
            "oikonomia.finan@gmail.com",
            "eleomar.orsi@gmail.com",
            "juli.orsi@gmail.com",
            "juli.orsi75@gmail.com",
        ];

        // Monitor de Estado de Autenticação
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Valida se o e-mail está na lista permitida
                if (EMAILS_PERMITIDOS.length > 0 && !EMAILS_PERMITIDOS.includes(user.email)) {
                    authError.innerText = `Acesso negado para o e-mail: ${user.email}`;
                    authError.classList.remove('hidden');
                    await signOut(auth); // Desconecta automaticamente
                    return;
                }

                // Usuário autorizado: exibe o app
                authError.classList.add('hidden');
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userEmailDisplay.innerText = user.email;
                carregarDados();
            } else {
                // Deslogado: mostra tela de login
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Ação de Login com Google via Pop-up
        btnLoginGoogle.addEventListener('click', async () => {
            authError.classList.add('hidden');
            authError.innerText = '';

            try {
                await signInWithPopup(auth, provider);
                // O onAuthStateChanged vai capturar o sucesso e abrir a tela automaticamente
            } catch (error) {
                console.error("Erro no login com pop-up:", error.code, error.message);
                if (error.code !== 'auth/popup-closed-by-user') {
                    authError.innerText = "Erro ao autenticar com o Google. Tente novamente.";
                    authError.classList.remove('hidden');
                }
            }
        });

        // Ação de Logout
        btnLogout.addEventListener('click', async () => {
            await signOut(auth);
        });

        // Preenche a data de hoje
        document.getElementById('data').valueAsDate = new Date();

        // Salvar Transação
        const form = document.getElementById('transacao-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const novaTransacao = {
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                categoria: document.getElementById('categoria').value,
                data: document.getElementById('data').value,
                criadoEm: serverTimestamp()
            };

            try {
                await addDoc(collection(db, 'transacoes'), novaTransacao);
                form.reset();
                document.getElementById('data').valueAsDate = new Date();
            } catch (error) {
                console.error("Erro ao salvar transação: ", error);
                alert("Erro ao salvar.");
            }
        });

        // Carregar Dados em Tempo Real
        function carregarDados() {
            const listaTransacoesEl = document.getElementById('lista-transacoes');
            const totalGeralEl = document.getElementById('total-geral');

            const q = query(collection(db, 'transacoes'), orderBy('data', 'desc'));

            onSnapshot(q, (snapshot) => {
                let html = '';
                let somaTotal = 0;

                if (snapshot.empty) {
                    listaTransacoesEl.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Nenhum lançamento encontrado.</td></tr>`;
                    totalGeralEl.innerText = "R$ 0,00";
                    return;
                }

                snapshot.forEach((doc) => {
                    const t = doc.data();
                    const valorFormatado = t.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const corValor = t.tipo === 'receita' ? 'text-emerald-600' : 'text-rose-600';
                    const sinal = t.tipo === 'receita' ? '+' : '-';

                    if (t.tipo === 'receita') {
                        somaTotal += t.valor;
                    } else {
                        somaTotal -= t.valor;
                    }

                    html += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 text-slate-500">${t.data.split('-').reverse().join('/')}</td>
                            <td class="p-3 font-medium">${t.descricao}</td>
                            <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs">${t.categoria}</span></td>
                            <td class="p-3 text-right font-bold ${corValor}">${sinal} ${valorFormatado}</td>
                        </tr>
                    `;
                });

                listaTransacoesEl.innerHTML = html;
                totalGeralEl.innerText = somaTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                totalGeralEl.className = `text-xl font-bold ${somaTotal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
            });
        }
    </script>
</body>
</html>
